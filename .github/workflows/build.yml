            private fun loadSettings() {
              val p = getSharedPreferences("procam_settings", Context.MODE_PRIVATE)
              gridOn = p.getBoolean("gridOn", gridOn)
              ratio169 = p.getBoolean("ratio169", ratio169)
              hq = p.getBoolean("hq", hq)
              audioOn = p.getBoolean("audioOn", audioOn)
              stab = p.getBoolean("stab", stab)
              resIdx = p.getInt("resIdx", resIdx).coerceIn(0, resN.size - 1)
              ri = p.getInt("ri", ri).coerceIn(0, rates.size - 1)
              vRatio = p.getInt("vRatio", vRatio).coerceIn(0, vNames.size - 1)
              procOn = p.getBoolean("procOn", procOn)
              procLevel = p.getInt("procLevel", procLevel).coerceIn(0, 2)
              rawPhoto = p.getBoolean("rawPhoto", rawPhoto)
              rawVideo = p.getBoolean("rawVideo", rawVideo)
              beautyLv = p.getInt("beautyLv", beautyLv).coerceIn(0, 3)
              sharpLv = p.getInt("sharpLv", sharpLv).coerceIn(0, 3)
              colBoost = p.getBoolean("colBoost", colBoost)
              apIdx = p.getInt("apIdx", apIdx).coerceIn(0, 3)
              maxHz = p.getBoolean("maxHz", maxHz)
              enhTimeIdx = p.getInt("enhTimeIdx", enhTimeIdx).coerceIn(0, 3)
              astroSub = p.getInt("astroSub", astroSub).coerceIn(0, 2)
              starSecIdx = p.getInt("starSecIdx", starSecIdx).coerceIn(0, 2)
              trailMinIdx = p.getInt("trailMinIdx", trailMinIdx).coerceIn(0, 3)
              introOn = p.getBoolean("introOn", introOn)
            }

            private fun saveSettings() {
              getSharedPreferences("procam_settings", Context.MODE_PRIVATE).edit()
                .putBoolean("gridOn", gridOn)
                .putBoolean("ratio169", ratio169)
                .putBoolean("hq", hq)
                .putBoolean("audioOn", audioOn)
                .putBoolean("stab", stab)
                .putInt("resIdx", resIdx)
                .putInt("ri", ri)
                .putInt("vRatio", vRatio)
                .putBoolean("procOn", procOn)
                .putInt("procLevel", procLevel)
                .putBoolean("rawPhoto", rawPhoto)
                .putBoolean("rawVideo", rawVideo)
                .putInt("beautyLv", beautyLv)
                .putInt("sharpLv", sharpLv)
                .putBoolean("colBoost", colBoost)
                .putInt("apIdx", apIdx)
                .putBoolean("maxHz", maxHz)
                .putInt("enhTimeIdx", enhTimeIdx)
                .putInt("astroSub", astroSub)
                .putInt("starSecIdx", starSecIdx)
                .putInt("trailMinIdx", trailMinIdx)
                .putBoolean("introOn", introOn)
                .apply()
            }

            private fun showPermissionDialog() {
              info.text = "Camera permission needed"
              AlertDialog.Builder(this)
                .setTitle("Camera permission needed")
                .setMessage("Photos and videos need the camera permission. You can allow it in app settings.")
                .setPositiveButton("Open Settings") { _, _ ->
                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", packageName, null)))
                }
                .setNegativeButton("Cancel", null)
