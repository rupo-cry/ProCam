                }
              }
              return AffineFit.fit(px, py, vx, vy, use, w0 / 2.0, h0 / 2.0, sc)
            }

            // hierarchical tile alignment of a frame against the reference (both as luma pyramids), guided by a robust global motion model.
            // Result: one shift per 32 px tile at full resolution.
            fun align(ref: Pyr, cur: Pyr): Aligned {
              val w0 = ref.w[0]
              val h0 = ref.h[0]
              val gw0 = (w0 + 31) / 32
              val gh0 = (h0 + 31) / 32
              if (ref.w[3] < 32 || ref.h[3] < 32) {
                return Aligned(32, gw0, gh0, IntArray(gw0 * gh0), IntArray(gw0 * gh0))
              }
              // level 3 (1/8): 16 px tiles, +-6, stride 2
              val gw3 = (ref.w[3] + 15) / 16
              val gh3 = (ref.h[3] + 15) / 16
              var cx = IntArray(gw3 * gh3)
              var cy = IntArray(gw3 * gh3)
              val valid3 = BooleanArray(gw3 * gh3)
              searchCoarse(ref.l[3], cur.l[3], ref.w[3], ref.h[3], 16, gw3, gh3, 6, 2, cx, cy, valid3)
              var model = fitLevel(cx, cy, gw3, gh3, 16, 3, valid3, w0, h0)
              var pgw = gw3
              var pgh = gh3
              // levels 2 and 1: 16 px tiles
              for (lv in 2 downTo 1) {
                val gw = (ref.w[lv] + 15) / 16
                val gh = (ref.h[lv] + 15) / 16
                val ix = IntArray(gw * gh)
                val iy = IntArray(gw * gh)
                val m = model
                if (m != null) modelInit(m, 16, gw, gh, lv, ix, iy)
                else upInit(cx, cy, pgw, pgh, 16, 16, gw, gh, ref.w[lv], ref.h[lv], ix, iy)
                val ox = IntArray(gw * gh)
                val oy = IntArray(gw * gh)
                val conf = FloatArray(gw * gh)
                refine(ref.l[lv], cur.l[lv], ref.w[lv], ref.h[lv], 16, gw, gh, if (lv == 2) 2 else 1, if (lv == 2) 1 else 2, ix, iy, ox, oy, conf)
                model = fitLevel(ox, oy, gw, gh, 16, lv, BooleanArray(gw * gh) { conf[it] > 0.14f }, w0, h0) ?: model
                cx = ox
                cy = oy
                pgw = gw
                pgh = gh
              }
              // level 0: 32 px tiles, +-1, stride 2
              val ix = IntArray(gw0 * gh0)
              val iy = IntArray(gw0 * gh0)
              val m = model
              if (m != null) modelInit(m, 32, gw0, gh0, 0, ix, iy)
              else upInit(cx, cy, pgw, pgh, 16, 32, gw0, gh0, w0, h0, ix, iy)
              val ox = IntArray(gw0 * gh0)
              val oy = IntArray(gw0 * gh0)
              refine(ref.l[0], cur.l[0], w0, h0, 32, gw0, gh0, 1, 2, ix, iy, ox, oy, FloatArray(gw0 * gh0))
              return Aligned(32, gw0, gh0, ox, oy)
            }
          }

          // Robust average of aligned frames. The reference frame always has weight 8; other frames get a per-pixel weight 0..8 that
          // drops where they disagree with the reference (moving objects, bad alignment) relative to the local noise level.
          class Merger(val w: Int, val h: Int, val ref: IntArray) {
            val n = w * h
            val sum = ShortArray(3 * n)
            val ws = ByteArray(n)
            val refL = Merge.luma8(ref, w, h)
            val refPyr = Merge.pyramid(refL, w, h)
            val nmap = Algo.noiseMap(ref, w, h)
            var count = 1
            var tolA = 2.0f
            var tolB = 4.2f
            var lastAccept = 1f

            init {
              for (i in 0 until n) {
                val p = ref[i]
                sum[3 * i] = (((p shr 16) and 255) * 8).toShort()
                sum[3 * i + 1] = (((p shr 8) and 255) * 8).toShort()
                sum[3 * i + 2] = ((p and 255) * 8).toShort()
                ws[i] = 8
              }
            }

            // merges one more frame (same size as the reference). returns the accepted fraction (0..1)
            fun add(cur: IntArray): Float {
              if (count >= 15) return 0f
              val curL = Merge.luma8(cur, w, h)
              val curPyr = Merge.pyramid(curL, w, h)
              val al = Merge.align(refPyr, curPyr)
              val rows = al.gh
              val next = java.util.concurrent.atomic.AtomicInteger(0)
              val accSum = java.util.concurrent.atomic.AtomicLong(0L)
              val tolA = this.tolA
              val tolB = this.tolB
              Par.run(Par.threads()) {
                val bw2 = (w + 1) / 2
                val adb = FloatArray(bw2 * 20)
                val tsx = IntArray(w)
                val tsy = IntArray(w)
                val sigRow = FloatArray(w)
                val wq = ByteArray(bw2 * 20)
                var local = 0L
                while (true) {
                  val ty = next.getAndIncrement()
                  if (ty >= rows) break
                  val y0 = ty * 32
                  val y1 = Math.min(h, y0 + 32)
                  for (x in 0 until w) {
                    val t = Math.min(al.gw - 1, x / 32)
                    tsx[x] = al.sx[ty * al.gw + t]
                    tsy[x] = al.sy[ty * al.gw + t]
                  }
                  // block rows: one extra row above and below for the 3x3 smoothing
                  val br0 = y0 / 2 - 1
                  val br1 = (y1 + 1) / 2
                  val nbr = br1 - br0 + 1
                  for (r in 0 until nbr) {
                    val by = br0 + r
                    for (bx in 0 until bw2) {
                      var s = 0
                      var chromaAd = 0f
                      for (dy in 0..1) {
                        val yy = Math.min(h - 1, Math.max(0, 2 * by + dy))
                        for (dx in 0..1) {
                          val xx = Math.min(w - 1, 2 * bx + dx)
                          val cxp = xx + tsx[xx]
                          val cyp = yy + tsy[xx]
                          if (cxp < 0 || cyp < 0 || cxp >= w || cyp >= h) {
                            s += 255
                            chromaAd = 255f
                          } else {
                            val ic = cyp * w + cxp
                            val ir = yy * w + xx
                            val yc = curL[ic].toInt() and 255
                            val yr = refL[ir].toInt() and 255
                            val d = yc - yr
                            s += if (d < 0) -d else d
                            if (dx == 0 && dy == 0) {
                              val pc = cur[ic]
                              val pr = ref[ir]
                              var dcb = ((pc and 255) - yc) - ((pr and 255) - yr)
                              var dcr = (((pc shr 16) and 255) - yc) - (((pr shr 16) and 255) - yr)
                              if (dcb < 0) dcb = -dcb
                              if (dcr < 0) dcr = -dcr
                              chromaAd = 0.4f * (0.564f * dcb + 0.713f * dcr)
                            }
                          }
                        }
                      }
                      val lAd = s * 0.25f
                      adb[r * bw2 + bx] = if (chromaAd > lAd) chromaAd else lAd
                    }
                  }
                  // weights per block of the strip
                  val nb = (y1 - y0 + 1) / 2
                  for (r in 0 until nb) {
                    val by = y0 / 2 + r
                    val ar = by - br0
                    val yc = Math.min(h - 1, 2 * by + 1)
                    nmap.fillRow(yc, w, sigRow, 0)
                    for (bx in 0 until bw2) {
                      var t = 0f
                      for (dy in -1..1) {
                        val rr = ar + dy
                        for (dx in -1..1) {
                          val xx = Math.min(bw2 - 1, Math.max(0, bx + dx))
                          t += adb[rr * bw2 + xx]
                        }
                      }
                      t *= (1f / 9f)
                      val ctr = adb[ar * bw2 + bx] * 0.8f
                      if (ctr > t) t = ctr
                      val sg = Math.max(0.8f, sigRow[Math.min(w - 1, 2 * bx + 1)])
                      val u = t / sg
                      val wgt = 1f - Algo.ss(tolA, tolB, u)
                      wq[r * bw2 + bx] = (wgt * 8f + 0.5f).toInt().toByte()
                    }
                  }
                  for (y in y0 until y1) {
                    val wr = (y / 2 - y0 / 2) * bw2
                    for (x in 0 until w) {
                      val wi = wq[wr + (x shr 1)].toInt()
                      if (wi <= 0) continue
                      val cxp = x + tsx[x]
                      val cyp = y + tsy[x]
                      if (cxp < 0 || cyp < 0 || cxp >= w || cyp >= h) continue
                      val p = cur[cyp * w + cxp]
                      val i = y * w + x
                      val j = 3 * i
                      sum[j] = (sum[j] + ((p shr 16) and 255) * wi).toShort()
                      sum[j + 1] = (sum[j + 1] + ((p shr 8) and 255) * wi).toShort()
                      sum[j + 2] = (sum[j + 2] + (p and 255) * wi).toShort()
                      ws[i] = (ws[i] + wi).toByte()
                      local += wi
                    }
                  }
                }
                accSum.addAndGet(local)
              }
              count++
              lastAccept = accSum.get().toFloat() / (8f * n)
              return lastAccept
            }

            // writes the merged result into the reference array and returns it
            fun finish(): IntArray {
              val recip = IntArray(8 * 15 + 1)
              for (i in 1 until recip.size) recip[i] = 65536 / i
              val next = java.util.concurrent.atomic.AtomicInteger(0)
              val nStrips = (h + 63) / 64
              Par.run(Par.threads()) {
                while (true) {
                  val s = next.getAndIncrement()
                  if (s >= nStrips) break
                  val a = s * 64 * w
                  val b = Math.min(h, s * 64 + 64) * w
                  for (i in a until b) {
                    val wsum = ws[i].toInt() and 255
                    val rc = recip[wsum]
                    val j = 3 * i
                    val r = (sum[j] * rc + 32768) shr 16
                    val g = (sum[j + 1] * rc + 32768) shr 16
                    val bl = (sum[j + 2] * rc + 32768) shr 16
                    ref[i] = (255 shl 24) or (Algo.c8i(r) shl 16) or (Algo.c8i(g) shl 8) or Algo.c8i(bl)
                  }
                }
              }
              return ref
            }
          }
