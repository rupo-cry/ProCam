          class GridView(c: Context) : View(c) {
            private val p = Paint()
            init { p.color = Color.argb(140, 255, 255, 255); p.strokeWidth = 2f }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat()
              val h = height.toFloat()
              cv.drawLine(w / 3, 0f, w / 3, h, p)
              cv.drawLine(2 * w / 3, 0f, 2 * w / 3, h, p)
              cv.drawLine(0f, h / 3, w, h / 3, p)
              cv.drawLine(0f, 2 * h / 3, w, 2 * h / 3, p)
            }
          }

          class ZoomWheel(c: Context, private val onMult: (Float) -> Unit) : View(c) {
            var zmin = 1f
            var zmax = 1f
            var cur = 1f
            private val dn = c.resources.displayMetrics.density
            private val ppo = 170f * dn
            private val p = Paint()
            private val tp = Paint()
            private var anim: ValueAnimator? = null
            private var last = 0f
            private val vals = floatArrayOf(0.5f, 0.6f, 0.7f, 0.8f, 0.9f, 1f, 1.2f, 1.4f, 1.6f, 1.8f, 2f, 2.5f, 3f, 4f, 5f, 6f, 8f, 10f, 15f, 20f, 30f)
            private val major = floatArrayOf(0.6f, 1f, 2f, 3f, 5f, 10f, 20f)
            private val gd = GestureDetector(c, object : GestureDetector.SimpleOnGestureListener() {
              override fun onDown(e: MotionEvent): Boolean { anim?.cancel(); return true }
              override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dx: Float, dy: Float): Boolean { mult(dx); return true }
              override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                anim?.cancel()
                last = 0f
                val a = ValueAnimator.ofFloat(0f, -vx * 0.3f)
                a.duration = 800
                a.interpolator = DecelerateInterpolator(2f)
                a.addUpdateListener { v ->
                  val x = v.animatedValue as Float
                  mult(x - last)
                  last = x
                }
                anim = a
                a.start()
                return true
              }
            })
            init {
              p.isAntiAlias = true
              tp.isAntiAlias = true
              tp.color = Color.WHITE
              tp.textSize = 11f * dn
              tp.textAlign = Paint.Align.CENTER
            }
            private fun mult(dx: Float) { onMult(Math.pow(2.0, (dx / ppo).toDouble()).toFloat()) }
            override fun onTouchEvent(e: MotionEvent): Boolean = gd.onTouchEvent(e)
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat()
              val h = height.toFloat()
              val cx = w / 2
              p.strokeWidth = 2f * dn
              for (v in vals) {
                if (v < zmin - 0.01f || v > zmax + 0.01f) continue
                val x = cx + (Math.log((v / cur).toDouble()) / Math.log(2.0)).toFloat() * ppo
                if (x < 0f || x > w) continue
                val fade = 1f - Math.min(1f, Math.abs(x - cx) / cx)
                val al = (60 + 195 * fade).toInt()
                val maj = major.contains(v)
                p.color = Color.argb(al, 255, 255, 255)
                cv.drawLine(x, h * (if (maj) 0.34f else 0.48f), x, h * 0.66f, p)
                if (maj) {
                  tp.alpha = al
                  cv.drawText(if (v == v.toInt().toFloat()) "${v.toInt()}x" else "$v", x, h * 0.28f, tp)
                }
              }
              p.color = Color.parseColor("#FF2D4B")
              p.strokeWidth = 3f * dn
              cv.drawLine(cx, h * 0.22f, cx, h * 0.78f, p)
            }
          }

          class MainActivity : ComponentActivity() {
            private val RED = Color.parseColor("#FF2D4B")
            private val DARK = Color.parseColor("#2A2236")
            private lateinit var pv: PreviewView
            private lateinit var info: TextView
            private lateinit var grid: GridView
            private lateinit var focusBox: View
            private lateinit var shutter: View
            private lateinit var thumb: ImageView
            private lateinit var toastV: TextView
            private lateinit var proPanel: LinearLayout
            private lateinit var settingsView: ScrollView
            private lateinit var settingsBox: LinearLayout
            private lateinit var flashChip: TextView
            private lateinit var timerChip: TextView
            private lateinit var resChip: TextView
            private lateinit var hdrChip: TextView
            private lateinit var pauseChip: TextView
            private lateinit var isoChip: TextView
            private lateinit var shChip: TextView
            private lateinit var wbChip: TextView
            private lateinit var evChip: TextView
            private lateinit var evSb: SeekBar
            private lateinit var isoSb: SeekBar
            private lateinit var shSb: SeekBar
            private lateinit var wbSb: SeekBar
            private val modeChips = mutableListOf<TextView>()
            private val zoomChips = mutableListOf<TextView>()
            private val refreshers = mutableListOf<() -> Unit>()
            private val handler = Handler(Looper.getMainLooper())
            private var provider: ProcessCameraProvider? = null
            private var camera: Camera? = null
            private var prev: Preview? = null
            private var img: ImageCapture? = null
            private var vc: VideoCapture<Recorder>? = null
            private var recording: Recording? = null
            private var mode = 0
            private var back = true
            private var flash = 0
            private var timerSec = 0
            private var counting = false
            private var paused = false
            private var pendingFlip = false
            private var pinched = false
            private var hdr = false
            private var hdrOk = false
            private var gridOn = false
            private var ratio169 = false
            private var hq = true
            private var audioOn = true
            private var stab = false
            private var resIdx = 0
            private var ri = 3
            private var lastUri: Uri? = null
            private var lastMime = "image/*"
            private var evLo = 0
            private var evStep = 0f
            private var evStr = "0.0"
            private var manExp = false
            private var manWb = false
            private var wbIdx = 2
            private var wasManual = false
            private var isoLo = 100
            private var isoHi = 800
            private var shDen = listOf<Int>()
            private var iso = 100
            private var expNs = 8_000_000L
            private var zmin = 1f
            private var zmax = 1f
            private var zTarget = 1f
            private var zCur = 1f
            private var zRunning = false
            private var dragging = false
            private var lastSel = -2
            private var maxHz = true
            private var hzMax = 60
            private lateinit var zoomWheel: ZoomWheel
            private lateinit var ratioRow: LinearLayout
            private lateinit var flashView: View
            private var vRatio = 0
            private var procOn = true
            private var procLevel = 1
            private var portraitZoom = 1.5f
            private var extMgr: ExtensionsManager? = null
            private var hwBokeh = false
            private val modeIds = intArrayOf(0, 3, 1, 2)
            private val vNames = arrayOf("16:9", "4:3", "Cinematic", "1:1")
            private val hideToast = Runnable { reveal(toastV, false) }
            private lateinit var zoomLabel: TextView
            private lateinit var settingsTitle: TextView
            private lateinit var photoBox: LinearLayout
            private lateinit var videoBox: LinearLayout
            private val resQ = arrayOf(Quality.FHD, Quality.FHD, Quality.UHD, Quality.HD, Quality.HD)
            private val resF = intArrayOf(60, 30, 30, 60, 30)
            private val resN = arrayOf("1080P 60FPS", "1080P 30FPS", "4K 30FPS", "720P 60FPS", "720P 30FPS")
            private val rates = intArrayOf(0, 10, 20, 30, 50, 80)
            private val wbNames = arrayOf("Tungsten", "Fluor", "Day", "Cloudy", "Shade")
            private val wbModes = intArrayOf(
              CaptureRequest.CONTROL_AWB_MODE_INCANDESCENT, CaptureRequest.CONTROL_AWB_MODE_FLUORESCENT,
              CaptureRequest.CONTROL_AWB_MODE_DAYLIGHT, CaptureRequest.CONTROL_AWB_MODE_CLOUDY_DAYLIGHT,
              CaptureRequest.CONTROL_AWB_MODE_SHADE
            )
            private val flashModes = intArrayOf(ImageCapture.FLASH_MODE_OFF, ImageCapture.FLASH_MODE_AUTO, ImageCapture.FLASH_MODE_ON)
            private val zoomVals = floatArrayOf(0.6f, 1f, 2f, 5f)

            private val permLauncher = registerForActivityResult(
              ActivityResultContracts.RequestMultiplePermissions()
            ) { r -> if (r[Manifest.permission.CAMERA] == true) startCamera() else info.text = "Camera permission needed" }

            private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

            private fun bg(fill: Int, r: Int, stroke: Int = 0, sw: Int = 2): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(fill)
              g.cornerRadius = dp(r).toFloat()
              if (stroke != 0) g.setStroke(dp(sw), stroke)
              return g
            }

            private fun lp(w: Int, h: Int, m: Int = 0, wt: Float = 0f): LinearLayout.LayoutParams {
              val l = LinearLayout.LayoutParams(w, h, wt)
              l.setMargins(dp(m), dp(m), dp(m), dp(m))
              return l
            }

            private fun chip(t: String, f: (TextView) -> Unit): TextView {
              val v = TextView(this)
              v.text = t
              v.setTextColor(Color.WHITE)
              v.textSize = 13f
              v.gravity = Gravity.CENTER
              v.setPadding(dp(10), dp(8), dp(10), dp(8))
              v.background = bg(DARK, 18)
              v.setOnClickListener { f(v) }
              press(v)
              return v
            }

            private fun press(v: View) {
              v.setOnTouchListener { x, e ->
                if (e.action == MotionEvent.ACTION_DOWN) x.animate().scaleX(0.92f).scaleY(0.92f).setDuration(90).start()
                else if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL)
                  x.animate().scaleX(1f).scaleY(1f).setDuration(240).setInterpolator(OvershootInterpolator()).start()
                false
              }
            }

            private fun reveal(v: View, show: Boolean) {
              v.animate().cancel()
              if (show) {
                if (v.visibility != View.VISIBLE) {
                  v.alpha = 0f
                  v.translationY = dp(30).toFloat()
                  v.visibility = View.VISIBLE
                }
                v.animate().alpha(1f).translationY(0f).setDuration(280).setInterpolator(DecelerateInterpolator()).start()
              } else if (v.visibility == View.VISIBLE) {
                v.animate().alpha(0f).translationY(dp(30).toFloat()).setDuration(200).setInterpolator(AccelerateInterpolator())
                  .withEndAction { v.visibility = View.GONE }.start()
              }
            }

            private fun pop(v: View) {
              v.scaleX = 0.6f
              v.scaleY = 0.6f
              v.animate().scaleX(1f).scaleY(1f).setDuration(380).setInterpolator(OvershootInterpolator()).start()
            }

            private fun fadePreview() {
              pv.animate().cancel()
              pv.alpha = 0.2f
              pv.animate().alpha(1f).setStartDelay(250).setDuration(350).start()
            }

            private fun buildRatioRow() {
              ratioRow.removeAllViews()
              val names = if (mode == 1) vNames else if (mode == 3) arrayOf("1.5x", "3x") else arrayOf("4:3", "16:9")
              val sel = if (mode == 1) vRatio else if (mode == 3) (if (portraitZoom >= 3f) 1 else 0) else if (ratio169) 1 else 0
              for (i in names.indices) {
                val c = chip(names[i]) {
                  if (mode == 3) {
                    portraitZoom = if (i == 1) 3f else 1.5f
                    zoomTo(portraitZoom)
                    buildRatioRow()
                  } else if (recording == null && !counting) {
                    if (mode == 1) vRatio = i else ratio169 = (i == 1)
                    updateResChip()
                    refreshers.forEach { it() }
                    buildRatioRow()
                    rebind()
                  }
                }
                mark(c, i == sel)
                ratioRow.addView(c, lp(-2, -2, 3))
              }
            }

            private fun mark(v: TextView, on: Boolean) {
              v.background = if (on) bg(Color.parseColor("#55FF2D4B"), 18, RED) else bg(DARK, 18)
            }

            private fun rowOf(vararg vs: View): LinearLayout {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              for (v in vs) r.addView(v, lp(0, -2, 3, 1f))
              return r
            }

            private fun slider(parent: LinearLayout, name: String, max: Int, cb: (Int, Boolean) -> String): SeekBar {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              r.gravity = Gravity.CENTER_VERTICAL
              val l = TextView(this)
              l.setTextColor(Color.WHITE)
              l.textSize = 12f
              l.text = name
              l.minWidth = dp(70)
              val v = TextView(this)
              v.setTextColor(Color.WHITE)
              v.textSize = 12f
              v.minWidth = dp(70)
              v.gravity = Gravity.END
              val sb = SeekBar(this)
              sb.max = max
              sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { v.text = cb(p, u) }
                override fun onStartTrackingTouch(s: SeekBar?) {}
                override fun onStopTrackingTouch(s: SeekBar?) {}
              })
              r.addView(l)
              r.addView(sb, LinearLayout.LayoutParams(0, -2, 1f))
              r.addView(v)
              parent.addView(r)
              return sb
            }

            private fun setting(parent: LinearLayout, name: String, value: () -> String, click: () -> Unit) {
              val t = chip("") { x -> click(); x.text = "$name      ${value()}" }
              t.gravity = Gravity.START or Gravity.CENTER_VERTICAL
              t.textSize = 15f
              t.text = "$name      ${value()}"
              refreshers.add { t.text = "$name      ${value()}" }
              parent.addView(t, lp(-1, -2, 4))
            }

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              val root = FrameLayout(this)
              root.setBackgroundColor(Color.parseColor("#0B0712"))
              val main = LinearLayout(this)
              main.orientation = LinearLayout.VERTICAL

              val flashN = arrayOf("⚡ Off", "⚡ Auto", "⚡ On")
              flashChip = chip(flashN[0]) { v -> flash = (flash + 1) % 3; v.text = flashN[flash]; applyFlash() }
              timerChip = chip("⏱ Off") { v ->
                timerSec = when (timerSec) { 0 -> 3; 3 -> 10; else -> 0 }
                v.text = if (timerSec == 0) "⏱ Off" else "⏱ ${timerSec}s"
              }
              resChip = chip("4:3") {
                if (recording == null) {
                  if (mode == 1) resIdx = (resIdx + 1) % resN.size else ratio169 = !ratio169
                  updateResChip()
                  refreshers.forEach { it() }
                  buildRatioRow()
                  rebind()
                }
              }
              hdrChip = chip("HDR") { toggleHdr() }
              val setChip = chip("⚙") { openSettings() }
              val top = rowOf(flashChip, timerChip, resChip, hdrChip, setChip)
              top.setPadding(dp(6), dp(6), dp(6), dp(6))
              main.addView(top, lp(-1, -2))

              val area = FrameLayout(this)
              pv = PreviewView(this)
              pv.scaleType = PreviewView.ScaleType.FIT_CENTER
              val sg = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                override fun onScale(d: ScaleGestureDetector): Boolean {
                  pinched = true
                  zoomTo(zTarget * d.scaleFactor)
                  return true
                }
              })
              pv.setOnTouchListener { _, e ->
                sg.onTouchEvent(e)
                if (e.action == MotionEvent.ACTION_DOWN) pinched = false
                if (e.action == MotionEvent.ACTION_UP && !pinched) tapFocus(e.x, e.y)
                true
              }
              area.addView(pv, FrameLayout.LayoutParams(-1, -1))
              grid = GridView(this)
              grid.visibility = View.GONE
              area.addView(grid, FrameLayout.LayoutParams(-1, -1))
              flashView = View(this)
              flashView.setBackgroundColor(Color.WHITE)
              flashView.alpha = 0f
              area.addView(flashView, FrameLayout.LayoutParams(-1, -1))
              focusBox = View(this)
              focusBox.background = bg(0, 4, Color.WHITE)
              focusBox.visibility = View.GONE
              area.addView(focusBox, FrameLayout.LayoutParams(dp(72), dp(72)))
              info = TextView(this)
              info.setTextColor(Color.WHITE)
              info.textSize = 16f
              area.addView(info, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.CENTER_HORIZONTAL))
              ratioRow = LinearLayout(this)
              ratioRow.orientation = LinearLayout.HORIZONTAL
              val rl = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.CENTER_HORIZONTAL)
              rl.topMargin = dp(34)
              area.addView(ratioRow, rl)

              val zoomRow = LinearLayout(this)
              zoomRow.orientation = LinearLayout.HORIZONTAL
              zoomRow.background = bg(Color.parseColor("#99000000"), 22)
              for (i in zoomVals.indices) {
                val z = zoomVals[i]
                val c = chip(if (z == 1f) "1x" else "$z".removeSuffix(".0")) {
                  zoomTo(z)
                }
                zoomChips.add(c)
                zoomRow.addView(c, lp(-2, -2, 2))
              }
              zoomLabel = TextView(this)
              zoomLabel.setTextColor(Color.WHITE)
              zoomLabel.textSize = 13f
              zoomLabel.text = "1.0x"
              zoomLabel.gravity = Gravity.CENTER
              zoomWheel = ZoomWheel(this) { m -> zoomTo(zTarget * m) }
              val zcol = LinearLayout(this)
              zcol.orientation = LinearLayout.VERTICAL
              zcol.gravity = Gravity.CENTER_HORIZONTAL
              zcol.addView(zoomLabel)
              zcol.addView(zoomWheel, LinearLayout.LayoutParams(-1, dp(46)))
              zcol.addView(zoomRow)
              val zl = FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM)
              zl.bottomMargin = dp(8)
              area.addView(zcol, zl)

              proPanel = LinearLayout(this)
              proPanel.orientation = LinearLayout.VERTICAL
              proPanel.setPadding(dp(12), dp(8), dp(12), dp(8))
              proPanel.background = bg(Color.parseColor("#E61A1424"), 18)
              proPanel.visibility = View.GONE
              isoChip = chip("ISO\nAuto") { manExp = !manExp; applyManual(); refreshPro() }
              shChip = chip("S\nAuto") { manExp = !manExp; applyManual(); refreshPro() }
              wbChip = chip("WB\nAuto") { manWb = !manWb; applyManual(); refreshPro() }
              evChip = chip("EV\n0.0") { evSb.progress = -evLo }
              proPanel.addView(rowOf(isoChip, shChip, wbChip, evChip))
              isoSb = slider(proPanel, "ISO", 100) { p, u ->
                iso = isoFor(p)
                if (u) { manExp = true; applyManual() }
                refreshPro()
                "$iso"
              }
              shSb = slider(proPanel, "Shutter", 0) { p, u ->
                if (shDen.isEmpty()) "-" else {
                  val d = shDen[p.coerceIn(0, shDen.size - 1)]
                  expNs = 1_000_000_000L / d
                  if (u) { manExp = true; applyManual() }
                  refreshPro()
                  "1/$d"
                }
              }
              wbSb = slider(proPanel, "WB", 4) { p, u ->
                wbIdx = p
                if (u) { manWb = true; applyManual() }
                refreshPro()
                wbNames[p]
              }
              evSb = slider(proPanel, "EV", 0) { p, _ ->
                camera?.cameraControl?.setExposureCompensationIndex(p + evLo)
                evStr = String.format("%.1f", (p + evLo) * evStep)
                evChip.text = "EV\n$evStr"
                evStr
              }
              val reset = chip("Reset") {
                manExp = false
