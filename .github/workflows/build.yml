          class ZoomWheel(c: Context, private val onMult: (Float) -> Unit, private val onTouch: () -> Unit = {}) : View(c) {
            var zmin = 1f
            var zmax = 1f
            var cur = 1f
            private val dn = c.resources.displayMetrics.density
            private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
            private var anim: ValueAnimator? = null
            private var last = 0f
            private val degPerOct = 36f
            private val majors = floatArrayOf(0.6f, 1f, 2f, 3f, 5f, 10f, 20f, 30f)
            private val ticks: FloatArray = buildTicks()
            private val gd = GestureDetector(c, object : GestureDetector.SimpleOnGestureListener() {
              override fun onDown(e: MotionEvent): Boolean { anim?.cancel(); return true }
              override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dx: Float, dy: Float): Boolean { mult(dx); return true }
              override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                anim?.cancel()
                last = 0f
                val a = ValueAnimator.ofFloat(0f, -vx * 0.22f)
                a.duration = 800
                a.interpolator = DecelerateInterpolator(2f)
                a.addUpdateListener { v ->
                  val x = v.animatedValue as Float
                  mult(x - last)
                  last = x
                }
                anim = a
                a.start()
                return true
              }
            })
            init {
              tp.color = Color.WHITE
              tp.textSize = 12f * dn
              tp.textAlign = Paint.Align.CENTER
            }
            private fun buildTicks(): FloatArray {
              val l = ArrayList<Float>()
              for (i in 5..29) l.add(i / 10f)
              for (i in 6..19) l.add(i / 2f)
              for (i in 5..15) l.add(i * 2f)
              return l.toFloatArray()
            }
            private fun isMajor(v: Float): Boolean {
              for (m in majors) if (Math.abs(m - v) < 0.001f) return true
              return false
            }
            private fun rad(): Float = width * 0.78f
            private fun mult(dx: Float) {
              val oct = (dx / rad()).toDouble() * 180.0 / Math.PI / degPerOct
              onMult(Math.pow(2.0, oct).toFloat())
            }
            override fun onTouchEvent(e: MotionEvent): Boolean {
              onTouch()
              return gd.onTouchEvent(e)
            }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat()
              val r = rad()
              val top = 8f * dn
              val cx = w / 2
              val cy = top + r
              p.style = Paint.Style.FILL
              p.color = Color.argb(110, 90, 90, 90)
              cv.drawCircle(cx, cy, r, p)
              p.style = Paint.Style.STROKE
              p.strokeWidth = 3f * dn
              p.color = Color.argb(70, 255, 255, 255)
              cv.drawCircle(cx, cy, r - 1.5f * dn, p)
              for (v in ticks) {
                if (v < zmin - 0.001f || v > zmax + 0.001f) continue
                val ang = (Math.log((v / cur).toDouble()) / Math.log(2.0)).toFloat() * degPerOct
                if (Math.abs(ang) > 44f) continue
                val fade = 1f - Math.min(1f, Math.abs(ang) / 50f)
                val al = (70 + 185 * fade).toInt()
                val maj = isMajor(v)
                cv.save()
                cv.rotate(ang, cx, cy)
                p.style = Paint.Style.STROKE
                p.strokeWidth = (if (maj) 2.5f else 1.8f) * dn
                p.color = Color.argb(al, 255, 255, 255)
                val len = (if (maj) 16f else 9f) * dn
                val y0 = top + 10f * dn
                cv.drawLine(cx, y0, cx, y0 + len, p)
                if (maj) {
                  tp.alpha = al
                  cv.drawText(if (v == v.toInt().toFloat()) "${v.toInt()}" else "$v", cx, y0 + len + 16f * dn, tp)
                }
                cv.restore()
