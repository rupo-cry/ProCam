name: Build ProCam APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/rupom/procam
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ProCam"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.rupom.procam"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.rupom.procam"
              minSdk = 29
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            val c = "1.3.4"
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.activity:activity-ktx:1.9.1")
            implementation("androidx.camera:camera-core:$c")
            implementation("androidx.camera:camera-camera2:$c")
            implementation("androidx.camera:camera-lifecycle:$c")
            implementation("androidx.camera:camera-video:$c")
            implementation("androidx.camera:camera-view:$c")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:label="Pro Cam" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/rupom/procam/MainActivity.kt <<'EOF'
          package com.rupom.procam

          import android.Manifest
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CaptureRequest
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.Range
          import android.util.Size
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.camera2.interop.Camera2CameraControl
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.camera2.interop.Camera2Interop
          import androidx.camera.camera2.interop.CaptureRequestOptions
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.*
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat

          class GridView(c: Context) : View(c) {
            private val p = Paint()
            init { p.color = Color.argb(140, 255, 255, 255); p.strokeWidth = 2f }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat()
              val h = height.toFloat()
              cv.drawLine(w / 3, 0f, w / 3, h, p)
              cv.drawLine(2 * w / 3, 0f, 2 * w / 3, h, p)
              cv.drawLine(0f, h / 3, w, h / 3, p)
              cv.drawLine(0f, 2 * h / 3, w, 2 * h / 3, p)
            }
          }

          class MainActivity : ComponentActivity() {
            private val RED = Color.parseColor("#FF2D4B")
            private val DARK = Color.parseColor("#2A2236")
            private lateinit var pv: PreviewView
            private lateinit var info: TextView
            private lateinit var grid: GridView
            private lateinit var focusBox: View
            private lateinit var shutter: View
            private lateinit var thumb: ImageView
            private lateinit var toastV: TextView
            private lateinit var proPanel: LinearLayout
            private lateinit var settingsView: ScrollView
            private lateinit var settingsBox: LinearLayout
            private lateinit var flashChip: TextView
            private lateinit var timerChip: TextView
            private lateinit var resChip: TextView
            private lateinit var hdrChip: TextView
            private lateinit var pauseChip: TextView
            private lateinit var isoChip: TextView
            private lateinit var shChip: TextView
            private lateinit var wbChip: TextView
            private lateinit var evChip: TextView
            private lateinit var evSb: SeekBar
            private lateinit var isoSb: SeekBar
            private lateinit var shSb: SeekBar
            private lateinit var wbSb: SeekBar
            private val modeChips = mutableListOf<TextView>()
            private val zoomChips = mutableListOf<TextView>()
            private val refreshers = mutableListOf<() -> Unit>()
            private val handler = Handler(Looper.getMainLooper())
            private var provider: ProcessCameraProvider? = null
            private var camera: Camera? = null
            private var prev: Preview? = null
            private var img: ImageCapture? = null
            private var vc: VideoCapture<Recorder>? = null
            private var recording: Recording? = null
            private var mode = 0
            private var back = true
            private var flash = 0
            private var timerSec = 0
            private var counting = false
            private var paused = false
            private var pendingFlip = false
            private var pinched = false
            private var hdr = false
            private var hdrOk = false
            private var gridOn = false
            private var ratio169 = false
            private var hq = true
            private var audioOn = true
            private var stab = false
            private var resIdx = 0
            private var ri = 3
            private var lastUri: Uri? = null
            private var lastMime = "image/*"
            private var evLo = 0
            private var evStep = 0f
            private var evStr = "0.0"
            private var manExp = false
            private var manWb = false
            private var wbIdx = 2
            private var wasManual = false
            private var isoLo = 100
            private var isoHi = 800
            private var shDen = listOf<Int>()
            private var iso = 100
            private var expNs = 8_000_000L
            private val resQ = arrayOf(Quality.FHD, Quality.FHD, Quality.UHD, Quality.HD, Quality.HD)
            private val resF = intArrayOf(60, 30, 30, 60, 30)
            private val resN = arrayOf("1080P 60FPS", "1080P 30FPS", "4K 30FPS", "720P 60FPS", "720P 30FPS")
            private val rates = intArrayOf(0, 10, 20, 30, 50, 80)
            private val wbNames = arrayOf("Tungsten", "Fluor", "Day", "Cloudy", "Shade")
            private val wbModes = intArrayOf(
              CaptureRequest.CONTROL_AWB_MODE_INCANDESCENT, CaptureRequest.CONTROL_AWB_MODE_FLUORESCENT,
              CaptureRequest.CONTROL_AWB_MODE_DAYLIGHT, CaptureRequest.CONTROL_AWB_MODE_CLOUDY_DAYLIGHT,
              CaptureRequest.CONTROL_AWB_MODE_SHADE
            )
            private val flashModes = intArrayOf(ImageCapture.FLASH_MODE_OFF, ImageCapture.FLASH_MODE_AUTO, ImageCapture.FLASH_MODE_ON)
            private val zoomVals = floatArrayOf(0.6f, 1f, 2f, 5f)

            private val permLauncher = registerForActivityResult(
              ActivityResultContracts.RequestMultiplePermissions()
            ) { r -> if (r[Manifest.permission.CAMERA] == true) startCamera() else info.text = "Camera permission needed" }

            private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

            private fun bg(fill: Int, r: Int, stroke: Int = 0, sw: Int = 2): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(fill)
              g.cornerRadius = dp(r).toFloat()
              if (stroke != 0) g.setStroke(dp(sw), stroke)
              return g
            }

            private fun lp(w: Int, h: Int, m: Int = 0, wt: Float = 0f): LinearLayout.LayoutParams {
              val l = LinearLayout.LayoutParams(w, h, wt)
              l.setMargins(dp(m), dp(m), dp(m), dp(m))
              return l
            }

            private fun chip(t: String, f: (TextView) -> Unit): TextView {
              val v = TextView(this)
              v.text = t
              v.setTextColor(Color.WHITE)
              v.textSize = 13f
              v.gravity = Gravity.CENTER
              v.setPadding(dp(10), dp(8), dp(10), dp(8))
              v.background = bg(DARK, 18)
              v.setOnClickListener { f(v) }
              return v
            }

            private fun mark(v: TextView, on: Boolean) {
              v.background = if (on) bg(Color.parseColor("#55FF2D4B"), 18, RED) else bg(DARK, 18)
            }

            private fun rowOf(vararg vs: View): LinearLayout {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              for (v in vs) r.addView(v, lp(0, -2, 3, 1f))
              return r
            }

            private fun slider(parent: LinearLayout, name: String, max: Int, cb: (Int, Boolean) -> String): SeekBar {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              r.gravity = Gravity.CENTER_VERTICAL
              val l = TextView(this)
              l.setTextColor(Color.WHITE)
              l.textSize = 12f
              l.text = name
              l.minWidth = dp(70)
              val v = TextView(this)
              v.setTextColor(Color.WHITE)
              v.textSize = 12f
              v.minWidth = dp(70)
              v.gravity = Gravity.END
              val sb = SeekBar(this)
              sb.max = max
              sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { v.text = cb(p, u) }
                override fun onStartTrackingTouch(s: SeekBar?) {}
                override fun onStopTrackingTouch(s: SeekBar?) {}
              })
              r.addView(l)
              r.addView(sb, LinearLayout.LayoutParams(0, -2, 1f))
              r.addView(v)
              parent.addView(r)
              return sb
            }

            private fun setting(name: String, value: () -> String, click: () -> Unit) {
              val t = chip("") { x -> click(); x.text = "$name      ${value()}" }
              t.gravity = Gravity.START or Gravity.CENTER_VERTICAL
              t.textSize = 15f
              t.text = "$name      ${value()}"
              refreshers.add { t.text = "$name      ${value()}" }
              settingsBox.addView(t, lp(-1, -2, 4))
            }

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              val root = FrameLayout(this)
              root.setBackgroundColor(Color.parseColor("#0B0712"))
              val main = LinearLayout(this)
              main.orientation = LinearLayout.VERTICAL

              val flashN = arrayOf("⚡ Off", "⚡ Auto", "⚡ On")
              flashChip = chip(flashN[0]) { v -> flash = (flash + 1) % 3; v.text = flashN[flash]; applyFlash() }
              timerChip = chip("⏱ Off") { v ->
                timerSec = when (timerSec) { 0 -> 3; 3 -> 10; else -> 0 }
                v.text = if (timerSec == 0) "⏱ Off" else "⏱ ${timerSec}s"
              }
              resChip = chip("4:3") {
                if (recording == null) {
                  if (mode == 1) resIdx = (resIdx + 1) % resN.size else ratio169 = !ratio169
                  updateResChip()
                  refreshers.forEach { it() }
                  rebind()
                }
              }
              hdrChip = chip("HDR") { toggleHdr() }
              val setChip = chip("⚙") { settingsView.visibility = View.VISIBLE }
              val top = rowOf(flashChip, timerChip, resChip, hdrChip, setChip)
              top.setPadding(dp(6), dp(6), dp(6), dp(6))
              main.addView(top, lp(-1, -2))

              val area = FrameLayout(this)
              pv = PreviewView(this)
              pv.scaleType = PreviewView.ScaleType.FIT_CENTER
              val sg = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                override fun onScale(d: ScaleGestureDetector): Boolean {
                  pinched = true
                  val z = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f
                  camera?.cameraControl?.setZoomRatio(z * d.scaleFactor)
                  return true
                }
              })
              pv.setOnTouchListener { _, e ->
                sg.onTouchEvent(e)
                if (e.action == MotionEvent.ACTION_DOWN) pinched = false
                if (e.action == MotionEvent.ACTION_UP && !pinched) tapFocus(e.x, e.y)
                true
              }
              area.addView(pv, FrameLayout.LayoutParams(-1, -1))
              grid = GridView(this)
              grid.visibility = View.GONE
              area.addView(grid, FrameLayout.LayoutParams(-1, -1))
              focusBox = View(this)
              focusBox.background = bg(0, 4, Color.WHITE)
              focusBox.visibility = View.GONE
              area.addView(focusBox, FrameLayout.LayoutParams(dp(72), dp(72)))
              info = TextView(this)
              info.setTextColor(Color.WHITE)
              info.textSize = 16f
              area.addView(info, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.CENTER_HORIZONTAL))

              val zoomRow = LinearLayout(this)
              zoomRow.orientation = LinearLayout.HORIZONTAL
              zoomRow.background = bg(Color.parseColor("#99000000"), 22)
              for (i in zoomVals.indices) {
                val z = zoomVals[i]
                val c = chip(if (z == 1f) "1x" else "$z".removeSuffix(".0")) {
                  camera?.cameraControl?.setZoomRatio(z)
                  markZoom(i)
                }
                zoomChips.add(c)
                zoomRow.addView(c, lp(-2, -2, 2))
              }
              val zl = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
              zl.bottomMargin = dp(8)
              area.addView(zoomRow, zl)

              proPanel = LinearLayout(this)
              proPanel.orientation = LinearLayout.VERTICAL
              proPanel.setPadding(dp(12), dp(8), dp(12), dp(8))
              proPanel.background = bg(Color.parseColor("#E61A1424"), 18)
              proPanel.visibility = View.GONE
              isoChip = chip("ISO\nAuto") { manExp = !manExp; applyManual(); refreshPro() }
              shChip = chip("S\nAuto") { manExp = !manExp; applyManual(); refreshPro() }
              wbChip = chip("WB\nAuto") { manWb = !manWb; applyManual(); refreshPro() }
              evChip = chip("EV\n0.0") { evSb.progress = -evLo }
              proPanel.addView(rowOf(isoChip, shChip, wbChip, evChip))
              isoSb = slider(proPanel, "ISO", 100) { p, u ->
                iso = isoFor(p)
                if (u) { manExp = true; applyManual() }
                refreshPro()
                "$iso"
              }
              shSb = slider(proPanel, "Shutter", 0) { p, u ->
                if (shDen.isEmpty()) "-" else {
                  val d = shDen[p.coerceIn(0, shDen.size - 1)]
                  expNs = 1_000_000_000L / d
                  if (u) { manExp = true; applyManual() }
                  refreshPro()
                  "1/$d"
                }
              }
              wbSb = slider(proPanel, "WB", 4) { p, u ->
                wbIdx = p
                if (u) { manWb = true; applyManual() }
                refreshPro()
                wbNames[p]
              }
              evSb = slider(proPanel, "EV", 0) { p, _ ->
                camera?.cameraControl?.setExposureCompensationIndex(p + evLo)
                evStr = String.format("%.1f", (p + evLo) * evStep)
                evChip.text = "EV\n$evStr"
                evStr
              }
              val reset = chip("Reset") {
                manExp = false
                manWb = false
                evSb.progress = -evLo
                applyManual()
                refreshPro()
              }
              proPanel.addView(reset, lp(-2, -2, 4))
              val pl = FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM)
              pl.bottomMargin = dp(52)
              area.addView(proPanel, pl)

              toastV = TextView(this)
              toastV.setTextColor(Color.WHITE)
              toastV.textSize = 13f
              toastV.setPadding(dp(16), dp(10), dp(16), dp(10))
              toastV.background = bg(Color.parseColor("#EE1A1424"), 20, Color.parseColor("#8B5CF6"))
              toastV.visibility = View.GONE
              toastV.setOnClickListener { openLast() }
              val tl = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
              tl.bottomMargin = dp(56)
              area.addView(toastV, tl)
              main.addView(area, lp(-1, 0, 0, 1f))

              val strip = LinearLayout(this)
              strip.orientation = LinearLayout.HORIZONTAL
              strip.gravity = Gravity.CENTER
              val names = arrayOf("PHOTO", "VIDEO", "PRO")
              for (i in names.indices) {
                val c = chip(names[i]) { setMode(i) }
                modeChips.add(c)
                strip.addView(c, lp(-2, -2, 4))
              }
              main.addView(strip, lp(-1, -2, 2))

              val ctl = FrameLayout(this)
              thumb = ImageView(this)
              thumb.scaleType = ImageView.ScaleType.CENTER_CROP
              thumb.background = bg(DARK, 10, Color.parseColor("#8B5CF6"))
              thumb.clipToOutline = true
              thumb.setOnClickListener { openLast() }
              val tlp = FrameLayout.LayoutParams(dp(54), dp(54), Gravity.START or Gravity.CENTER_VERTICAL)
              tlp.leftMargin = dp(24)
              ctl.addView(thumb, tlp)
              shutter = View(this)
              shutter.setOnClickListener { onShutter() }
              ctl.addView(shutter, FrameLayout.LayoutParams(dp(76), dp(76), Gravity.CENTER))
              val right = LinearLayout(this)
              right.orientation = LinearLayout.VERTICAL
              pauseChip = chip("⏸") { onPause(it) }
              pauseChip.visibility = View.GONE
              val flip = chip("⟳ Flip") {
                if (recording != null) { pendingFlip = true; recording?.stop() }
                else if (!counting) { back = !back; rebind() }
              }
              right.addView(pauseChip, lp(-2, -2, 3))
              right.addView(flip, lp(-2, -2, 3))
              val rlp = FrameLayout.LayoutParams(-2, -2, Gravity.END or Gravity.CENTER_VERTICAL)
              rlp.rightMargin = dp(16)
              ctl.addView(right, rlp)
              main.addView(ctl, lp(-1, dp(100), 0))
              root.addView(main, FrameLayout.LayoutParams(-1, -1))

              settingsView = ScrollView(this)
              settingsView.setBackgroundColor(Color.parseColor("#F00B0712"))
              settingsView.visibility = View.GONE
              settingsBox = LinearLayout(this)
              settingsBox.orientation = LinearLayout.VERTICAL
              settingsBox.setPadding(dp(14), dp(14), dp(14), dp(24))
              val back1 = chip("←  Settings") { settingsView.visibility = View.GONE }
              back1.textSize = 17f
              back1.gravity = Gravity.START or Gravity.CENTER_VERTICAL
              settingsBox.addView(back1, lp(-1, -2, 4))
              setting("Grid Lines", { if (gridOn) "On" else "Off" }) {
                gridOn = !gridOn
                grid.visibility = if (gridOn) View.VISIBLE else View.GONE
              }
              setting("Aspect Ratio (photo)", { if (ratio169) "16:9" else "4:3" }) {
                ratio169 = !ratio169
                updateResChip()
                if (mode != 1 && recording == null) rebind()
              }
              setting("Picture Quality", { if (hq) "High" else "Fast" }) {
                hq = !hq
                if (mode != 1 && recording == null) rebind()
              }
              setting("Video Resolution", { resN[resIdx] }) {
                resIdx = (resIdx + 1) % resN.size
                updateResChip()
                if (mode == 1 && recording == null) rebind()
              }
              setting("Bitrate", { if (ri == 0) "Auto" else "${rates[ri]} Mbps" }) {
                ri = (ri + 1) % rates.size
                if (mode == 1 && recording == null) rebind()
              }
              setting("Audio", { if (audioOn) "On" else "Off" }) { audioOn = !audioOn }
              setting("Video Stabilization", { if (stab) "On" else "Off" }) {
                stab = !stab
                if (mode == 1 && recording == null) rebind()
              }
              setting("Restore Defaults", { "" }) {
                gridOn = false
                grid.visibility = View.GONE
                ratio169 = false
                hq = true
                audioOn = true
                stab = false
                resIdx = 0
                ri = 3
                refreshers.forEach { it() }
                updateResChip()
                if (recording == null) rebind()
              }
              settingsView.addView(settingsBox)
              root.addView(settingsView, FrameLayout.LayoutParams(-1, -1))
              setContentView(root)
              setMode(0)

              val need = arrayOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
              if (need.all { checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED }) startCamera()
              else permLauncher.launch(need)
            }

            override fun onConfigurationChanged(c: Configuration) {
              super.onConfigurationChanged(c)
              @Suppress("DEPRECATION")
              val r = windowManager.defaultDisplay.rotation
              prev?.targetRotation = r
              img?.targetRotation = r
              if (recording == null) vc?.targetRotation = r
            }

            private fun toast(m: String) {
              toastV.text = m
              toastV.visibility = View.VISIBLE
              handler.postDelayed({ toastV.visibility = View.GONE }, 2500)
            }

            private fun openLast() {
              val u = lastUri ?: return
              try {
                startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(u, lastMime).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
              } catch (e: Exception) { toast("No gallery app found") }
            }

            private fun saved(uri: Uri?, mime: String, msg: String) {
              if (uri == null) return
              lastUri = uri
              lastMime = mime
              toast("$msg\nTap to view")
              Thread {
                try {
                  val bm = contentResolver.loadThumbnail(uri, Size(256, 256), null)
                  runOnUiThread { thumb.setImageBitmap(bm) }
                } catch (e: Exception) { }
              }.start()
            }

            private fun markZoom(i: Int) { for (k in zoomChips.indices) mark(zoomChips[k], k == i) }

            private fun updateResChip() {
              resChip.text = if (mode == 1) resN[resIdx] else if (ratio169) "16:9" else "4:3"
            }

            private fun updateShutter() {
              val rec = recording != null
              val red = mode == 1 || rec
              shutter.background = bg(if (red) RED else Color.WHITE, if (rec) 18 else 38, if (red) Color.WHITE else RED, 5)
            }

            private fun refreshPro() {
              isoChip.text = if (manExp) "ISO\n$iso" else "ISO\nAuto"
              shChip.text = if (manExp) "S\n${shDen.getOrNull(shSb.progress)?.let { "1/$it" } ?: "-"}" else "S\nAuto"
              wbChip.text = if (manWb) "WB\n${wbNames[wbIdx]}" else "WB\nAuto"
              mark(isoChip, manExp)
              mark(shChip, manExp)
              mark(wbChip, manWb)
            }

            private fun setMode(m: Int) {
              if (recording != null || counting) return
              mode = m
              if (m != 2) { manExp = false; manWb = false; wasManual = false }
              for (i in modeChips.indices) mark(modeChips[i], i == m)
              proPanel.visibility = if (m == 2) View.VISIBLE else View.GONE
              updateResChip()
              updateShutter()
              refreshPro()
              rebind()
            }

            private fun toggleHdr() {
              if (!hdrOk) { toast("HDR not supported on this camera"); return }
              hdr = !hdr
              mark(hdrChip, hdr)
              applyManual()
            }

            private fun applyFlash() {
              img?.flashMode = flashModes[flash]
              camera?.cameraControl?.enableTorch(mode == 1 && flash == 2)
            }

            private fun tapFocus(x: Float, y: Float) {
              val pt = pv.meteringPointFactory.createPoint(x, y)
              camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(pt).build())
              focusBox.x = x - dp(36)
              focusBox.y = y - dp(36)
              focusBox.visibility = View.VISIBLE
              handler.postDelayed({ focusBox.visibility = View.GONE }, 900)
            }

            private fun isoFor(p: Int): Int = (isoLo * Math.pow(isoHi.toDouble() / isoLo, p / 100.0)).toInt()

            private fun startCamera() {
              val f = ProcessCameraProvider.getInstance(this)
              f.addListener({
                provider = f.get()
                rebind()
              }, ContextCompat.getMainExecutor(this))
            }

            private fun rebind() {
              val p = provider ?: return
              p.unbindAll()
              img = null
              vc = null
              val fps = resF[resIdx]
              val range = Range(fps, fps)
              val ar = if (mode == 1 || ratio169) AspectRatio.RATIO_16_9 else AspectRatio.RATIO_4_3
              val pb = Preview.Builder().setTargetAspectRatio(ar)
              if (mode == 1) {
                pb.setTargetFrameRate(range)
                Camera2Interop.Extender(pb).setCaptureRequestOption(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, range)
              }
              val preview = pb.build()
              preview.setSurfaceProvider(pv.surfaceProvider)
              prev = preview
              try {
                val sel = if (back) CameraSelector.DEFAULT_BACK_CAMERA else CameraSelector.DEFAULT_FRONT_CAMERA
                val cam: Camera
                if (mode == 1) {
                  val q = resQ[resIdx]
                  val rb = Recorder.Builder().setQualitySelector(QualitySelector.from(q, FallbackStrategy.lowerQualityOrHigherThan(q)))
                  if (rates[ri] > 0) rb.setTargetVideoEncodingBitRate(rates[ri] * 1_000_000)
                  val vb = VideoCapture.Builder(rb.build()).setTargetFrameRate(range)
                  val ex = Camera2Interop.Extender(vb)
                  ex.setCaptureRequestOption(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, range)
                  if (stab) ex.setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)
                  val cap = vb.build()
                  vc = cap
                  cam = p.bindToLifecycle(this, sel, preview, cap)
                } else {
                  val ic = ImageCapture.Builder()
                    .setCaptureMode(if (hq) ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY else ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                    .setTargetAspectRatio(ar).build()
                  img = ic
                  cam = p.bindToLifecycle(this, sel, preview, ic)
                }
                camera = cam
                readCaps(cam)
                applyFlash()
                applyManual()
                markZoom(1)
                info.text = if (mode == 1) resN[resIdx] else ""
              } catch (e: Exception) {
                if (mode == 1 && resF[resIdx] == 60) {
                  resIdx += 1
                  updateResChip()
                  rebind()
                  toast("60fps failed here, using 30fps")
                } else info.text = "Error: ${e.message}"
              }
            }

            private fun readCaps(cam: Camera) {
              val es = cam.cameraInfo.exposureState
              val er = es.exposureCompensationRange
              evLo = er.lower
              evStep = es.exposureCompensationStep.toFloat()
              evSb.max = er.upper - er.lower
              evSb.progress = -er.lower
              val zs = cam.cameraInfo.zoomState.value
              val zmin = zs?.minZoomRatio ?: 1f
              val zmax = zs?.maxZoomRatio ?: 1f
              for (i in zoomVals.indices) {
                zoomChips[i].visibility = if (zoomVals[i] >= zmin - 0.01f && zoomVals[i] <= zmax) View.VISIBLE else View.GONE
              }
              try {
                val ci = Camera2CameraInfo.from(cam.cameraInfo)
                val ir = ci.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE)
                if (ir != null) { isoLo = ir.lower; isoHi = minOf(ir.upper, 6400) }
                val tr = ci.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE)
                val dens = listOf(8000, 4000, 2000, 1000, 500, 250, 125, 60, 30, 15, 8, 4)
                val fps = resF[resIdx]
                shDen = dens.filter { d ->
                  val ns = 1_000_000_000L / d
                  (mode != 1 || d >= fps) && (tr == null || (ns >= tr.lower && ns <= tr.upper))
                }
                hdrOk = ci.getCameraCharacteristic(CameraCharacteristics.CONTROL_AVAILABLE_SCENE_MODES)
                  ?.contains(CaptureRequest.CONTROL_SCENE_MODE_HDR) == true
              } catch (e: Exception) {
                shDen = listOf()
                hdrOk = false
              }
              shSb.max = maxOf(shDen.size - 1, 0)
              shSb.progress = shDen.indexOf(125).coerceAtLeast(0)
              isoSb.progress = 30
              wbSb.progress = 2
              iso = isoFor(isoSb.progress)
              if (shDen.isNotEmpty()) expNs = 1_000_000_000L / shDen[shSb.progress.coerceIn(0, shDen.size - 1)]
              wbIdx = wbSb.progress
              refreshPro()
            }

            private fun applyManual() {
              val cam = camera ?: return
              try {
                val c2 = Camera2CameraControl.from(cam.cameraControl)
                if (!manExp && !manWb && !hdr) {
                  if (wasManual) c2.clearCaptureRequestOptions()
                  wasManual = false
                  return
                }
                val b = CaptureRequestOptions.Builder()
                if (manExp) {
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_OFF)
                  b.setCaptureRequestOption(CaptureRequest.SENSOR_SENSITIVITY, iso)
                  b.setCaptureRequestOption(CaptureRequest.SENSOR_EXPOSURE_TIME, expNs)
                }
                if (manWb) b.setCaptureRequestOption(CaptureRequest.CONTROL_AWB_MODE, wbModes[wbIdx])
                if (hdr) {
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_MODE, CaptureRequest.CONTROL_MODE_USE_SCENE_MODE)
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_SCENE_MODE, CaptureRequest.CONTROL_SCENE_MODE_HDR)
                }
                c2.setCaptureRequestOptions(b.build())
                wasManual = true
              } catch (e: Exception) {
                info.text = "Manual not supported: ${e.message}"
              }
            }

            private fun onShutter() {
              if (counting) {
                counting = false
                handler.removeCallbacksAndMessages(null)
                info.text = ""
                return
              }
              if (mode == 1) {
                val r = recording
                if (r != null) { r.stop(); return }
                if (timerSec > 0) { counting = true; countdown(timerSec) { startRec() } } else startRec()
              } else {
                if (timerSec > 0) { counting = true; countdown(timerSec) { takePhoto() } } else takePhoto()
              }
            }

            private fun countdown(n: Int, done: () -> Unit) {
              if (!counting) return
              if (n == 0) {
                counting = false
                info.text = ""
                done()
                return
              }
              info.text = "$n"
              handler.postDelayed({ countdown(n - 1, done) }, 1000)
            }

            private fun takePhoto() {
              val ic = img ?: return
              val cv = ContentValues()
              cv.put(MediaStore.Images.Media.DISPLAY_NAME, "ProCam_${System.currentTimeMillis()}")
              cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
              cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/ProCam")
              val o = ImageCapture.OutputFileOptions.Builder(contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv).build()
              ic.takePicture(o, ContextCompat.getMainExecutor(this), object : ImageCapture.OnImageSavedCallback {
                override fun onImageSaved(r: ImageCapture.OutputFileResults) { saved(r.savedUri, "image/*", "Photo Saved") }
                override fun onError(e: ImageCaptureException) { toast("Error: ${e.message}") }
              })
            }

            private fun onPause(v: TextView) {
              val r = recording ?: return
              if (paused) { r.resume(); paused = false; v.text = "⏸" } else { r.pause(); paused = true; v.text = "▶" }
            }

            private fun startRec() {
              val cap = vc ?: return
              val cv = ContentValues()
              cv.put(MediaStore.Video.Media.DISPLAY_NAME, "ProCam_${System.currentTimeMillis()}")
              cv.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
              cv.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/ProCam")
              val out = MediaStoreOutputOptions.Builder(contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                .setContentValues(cv).build()
              var pr = cap.output.prepareRecording(this, out)
              if (audioOn && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) pr = pr.withAudioEnabled()
              recording = pr.start(ContextCompat.getMainExecutor(this)) { e ->
                if (e is VideoRecordEvent.Status) {
                  val s = e.recordingStats.recordedDurationNanos / 1_000_000_000L
                  info.text = "● " + String.format("%02d:%02d", s / 60, s % 60)
                }
                if (e is VideoRecordEvent.Finalize) {
                  recording = null
                  paused = false
                  pauseChip.text = "⏸"
                  pauseChip.visibility = View.GONE
                  updateShutter()
                  info.text = resN[resIdx]
                  if (e.hasError()) toast("Error ${e.error}") else saved(e.outputResults.outputUri, "video/*", "Video Saved")
                  if (pendingFlip) {
                    pendingFlip = false
                    back = !back
                    rebind()
                    handler.postDelayed({ startRec() }, 600)
                  }
                }
              }
              pauseChip.visibility = View.VISIBLE
              updateShutter()
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ProCam build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
