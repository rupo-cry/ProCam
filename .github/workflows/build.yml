name: Build ProCam APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/rupom/procam
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ProCam"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.rupom.procam"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.rupom.procam"
              minSdk = 29
              targetSdk = 34
              versionCode = 4
              versionName = "1.5"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            val c = "1.3.4"
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.activity:activity-ktx:1.9.1")
            implementation("androidx.camera:camera-core:$c")
            implementation("androidx.camera:camera-camera2:$c")
            implementation("androidx.camera:camera-lifecycle:$c")
            implementation("androidx.camera:camera-video:$c")
            implementation("androidx.camera:camera-view:$c")
            implementation("androidx.camera:camera-extensions:$c")
            implementation("com.google.mlkit:segmentation-selfie:16.0.0-beta6")
            implementation("com.google.mlkit:face-detection:16.1.6")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:label="Pro Cam" android:largeHeap="true" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/rupom/procam/Algo1.kt <<'KT_ALGO1'
          package com.rupom.procam

          class EnhParams(
            val level: Int,
            val lite: Boolean,
            val sharp: Int,
            val beauty: Int,
            val colBoost: Boolean,
            val zoomBoost: Boolean,
            val gain: Float,
            val clarity: Float
          )

          class GScratch(n: Int) {
            val t = FloatArray(n)
            val x1 = FloatArray(n)
            val mI = FloatArray(n)
            val mII = FloatArray(n)
            val a = FloatArray(n)
            val b = FloatArray(n)
            val mA = FloatArray(n)
            val mB = FloatArray(n)
          }

          class NoiseMap(val bs: Int, val gw: Int, val gh: Int, val g: FloatArray) {
            // fills dst[0 until w] with the interpolated noise level for image row y
            fun fillRow(y: Int, w: Int, dst: FloatArray, off: Int) {
              val fy = (y + 0.5f) / bs - 0.5f
              var y0 = fy.toInt()
              if (fy < 0f) y0 = 0
              if (y0 > gh - 1) y0 = gh - 1
              val y1 = Math.min(gh - 1, y0 + 1)
              var ty = fy - y0
              if (ty < 0f) ty = 0f else if (ty > 1f) ty = 1f
              for (x in 0 until w) {
                val fx = (x + 0.5f) / bs - 0.5f
                var x0 = fx.toInt()
                if (fx < 0f) x0 = 0
                if (x0 > gw - 1) x0 = gw - 1
                val x1 = Math.min(gw - 1, x0 + 1)
                var tx = fx - x0
                if (tx < 0f) tx = 0f else if (tx > 1f) tx = 1f
                dst[off + x] = (g[y0 * gw + x0] * (1f - tx) + g[y0 * gw + x1] * tx) * (1f - ty) +
                  (g[y1 * gw + x0] * (1f - tx) + g[y1 * gw + x1] * tx) * ty
              }
            }
          }

          object Algo {
            var forceSigma = 0f
            fun c8(v: Float): Int = if (v < 0f) 0 else if (v > 254.5f) 255 else (v + 0.5f).toInt()
            fun c8i(v: Int): Int = if (v < 0) 0 else if (v > 255) 255 else v

            fun ss(a: Float, b: Float, x: Float): Float {
              var t = (x - a) / (b - a)
              if (t < 0f) t = 0f else if (t > 1f) t = 1f
              return t * t * (3f - 2f * t)
            }

            fun lum(p: Int): Int = (((p shr 16) and 255) * 77 + ((p shr 8) and 255) * 151 + (p and 255) * 28) shr 8

            // robust noise level (std-dev in 0..255 luma units) from the 35th percentile of |laplacian|
            fun noiseSigma(px: IntArray, w: Int, h: Int): Float {
              val hist = IntArray(256)
              var n = 0
              var y = 2
              while (y < h - 2) {
                var x = 2
                while (x < w - 2) {
                  val i = y * w + x
                  var d = 4 * lum(px[i]) - lum(px[i - 1]) - lum(px[i + 1]) - lum(px[i - w]) - lum(px[i + w])
                  if (d < 0) d = -d
                  hist[if (d > 255) 255 else d]++
                  n++
                  x += 5
                }
                y += 5
              }
              if (n == 0) return 2f
              val target = (n * 0.35f).toInt()
              var acc = 0
              var q = 0
              while (q < 255) {
                acc += hist[q]
                if (acc >= target) break
                q++
              }
              val s = q / 2.0f
              return Math.max(0.8f, Math.min(9f, s))
            }


            // local noise level (std-dev, 0..255 luma units) on a coarse grid, from the 25th percentile of 3x3 variances
            fun noiseMap(px: IntArray, w: Int, h: Int): NoiseMap {
              val bs = 48
              val gw = (w + bs - 1) / bs
              val gh = (h + bs - 1) / bs
              val raw = FloatArray(gw * gh)
              val vals = FloatArray(bs * bs / 4 + 16)
              for (by in 0 until gh) {
                for (bx in 0 until gw) {
                  var cnt = 0
                  val ya = Math.max(1, by * bs)
                  val yb = Math.min(h - 1, (by + 1) * bs)
                  val xa = Math.max(1, bx * bs)
                  val xb = Math.min(w - 1, (bx + 1) * bs)
                  var y = ya
                  while (y < yb) {
                    var x = xa
                    while (x < xb) {
                      var s1 = 0
                      var s2 = 0
                      for (dy in -1..1) {
                        val rb = (y + dy) * w + x
                        for (dx in -1..1) {
                          val l = lum(px[rb + dx])
                          s1 += l
                          s2 += l * l
                        }
                      }
                      vals[cnt++] = (s2 - s1 * s1 / 9f) / 9f
                      x += 2
                    }
                    y += 2
                  }
                  var v = -1f
                  if (cnt >= 30) {
                    java.util.Arrays.sort(vals, 0, cnt)
                    v = Math.sqrt((vals[(cnt * 0.25f).toInt()] / 0.57f).toDouble()).toFloat()
                  }
                  raw[by * gw + bx] = v
                }
              }
              // reference = 25th percentile of valid blocks; cap textured blocks to a multiple of it
              val valid = ArrayList<Float>()
              for (v in raw) if (v >= 0f) valid.add(v)
              valid.sort()
              val ref = if (valid.isEmpty()) 1.5f else valid[(valid.size * 0.25f).toInt()]
              val cap = Math.max(1.8f, 2.6f * Math.max(ref, 0.8f))
              for (i in raw.indices) raw[i] = if (raw[i] < 0f) ref else Math.min(Math.max(raw[i], 0.8f), cap)
              // min over 3x3 blocks, then smooth
              val mn = FloatArray(raw.size)
              for (by in 0 until gh) for (bx in 0 until gw) {
                var m = 1000f
                for (dy in -1..1) for (dx in -1..1) {
                  val yy = by + dy
                  val xx = bx + dx
                  if (yy >= 0 && yy < gh && xx >= 0 && xx < gw) m = Math.min(m, raw[yy * gw + xx])
                }
                mn[by * gw + bx] = m
              }
              val sm = FloatArray(raw.size)
              for (by in 0 until gh) for (bx in 0 until gw) {
                var sum = 0f
                var c = 0
                for (dy in -1..1) for (dx in -1..1) {
                  val yy = by + dy
                  val xx = bx + dx
                  if (yy >= 0 && yy < gh && xx >= 0 && xx < gw) { sum += mn[yy * gw + xx]; c++ }
                }
                sm[by * gw + bx] = sum / c
              }
              return NoiseMap(bs, gw, gh, sm)
            }

            // running-sum box mean with edge clamp. src/dst/tmp are at least w*h long.
            fun box(src: FloatArray, dst: FloatArray, tmp: FloatArray, w: Int, h: Int, r: Int) {
              val div = 1f / (2 * r + 1)
              for (y in 0 until h) {
                val b = y * w
                var s = 0f
                for (i in -r..r) {
                  val xi = if (i < 0) 0 else if (i > w - 1) w - 1 else i
                  s += src[b + xi]
                }
                for (x in 0 until w) {
                  tmp[b + x] = s * div
                  val xa = if (x + r + 1 > w - 1) w - 1 else x + r + 1
                  val xb = if (x - r < 0) 0 else x - r
                  s += src[b + xa] - src[b + xb]
                }
              }
              val cs = FloatArray(w)
              for (i in -r..r) {
                val yi = if (i < 0) 0 else if (i > h - 1) h - 1 else i
                val rb = yi * w
                for (x in 0 until w) cs[x] += tmp[rb + x]
              }
              for (y in 0 until h) {
                val ob = y * w
                for (x in 0 until w) dst[ob + x] = cs[x] * div
                val ya = (if (y + r + 1 > h - 1) h - 1 else y + r + 1) * w
                val yb = (if (y - r < 0) 0 else y - r) * w
                for (x in 0 until w) cs[x] += tmp[ya + x] - tmp[yb + x]
              }
            }

            // self-guided filter (edge preserving smoothing). eps[i] = k2 * sig[i]^2. s.a keeps the per-pixel edge coefficient.
            fun guidedSelf(gi: FloatArray, out: FloatArray, w: Int, h: Int, r: Int, sig: FloatArray, k2: Float, s: GScratch) {
              val n = w * h
              box(gi, s.mI, s.t, w, h, r)
              for (i in 0 until n) s.x1[i] = gi[i] * gi[i]
              box(s.x1, s.mII, s.t, w, h, r)
              for (i in 0 until n) {
                var v = s.mII[i] - s.mI[i] * s.mI[i]
                if (v < 0f) v = 0f
                val k = v / (v + k2 * sig[i] * sig[i] + 0.05f)
                s.a[i] = k
                s.b[i] = (1f - k) * s.mI[i]
              }
              box(s.a, s.mA, s.t, w, h, r)
              box(s.b, s.mB, s.t, w, h, r)
              for (i in 0 until n) out[i] = s.mA[i] * gi[i] + s.mB[i]
            }
          }
          KT_ALGO1
          cat > app/src/main/java/com/rupom/procam/Algo2.kt <<'KT_ALGO2'
          package com.rupom.procam

          // photo enhancement: edge-preserving denoise, hue-preserving colour, natural tone, noise-aware sharpening
          // Works on horizontal strips (64 rows + 10 row margins); strips are handed out to worker threads.
          class EnhJob(
            val px: IntArray,
            val w: Int,
            val h: Int,
            val p: EnhParams,
            val faces: IntArray,
            val out: IntArray,
            val nmap: NoiseMap,
            val lg: FloatArray,
            val gw: Int,
            val gh: Int
          ) {
            val gs = 16
            val SH = 64
            val M = 10
            val nStrips = (h + SH - 1) / SH
            val lite = p.lite
            val lv = p.level
            val kY = (if (lite) 1.1f else floatArrayOf(1.4f, 1.9f, 2.5f)[lv]) + (if (p.zoomBoost) 0.4f else 0f)
            val sharpAmt = (if (lite) 0.45f else floatArrayOf(0f, 0.55f, 0.9f, 1.4f)[p.sharp]) +
              (if (!lite && p.sharp > 0 && p.zoomBoost) 0.15f else 0f)
            val tone = if (lite) 0f else floatArrayOf(0.8f, 1f, 1.25f)[lv]
            val sCurve = if (lite) 0f else floatArrayOf(0.12f, 0.18f, 0.26f)[lv]
            val clar = if (lite) 0f else floatArrayOf(0.10f, 0.14f, 0.20f)[lv] * p.clarity
            val vib = if (lite) 0f else floatArrayOf(0.10f, 0.16f, 0.24f)[lv]
            val boostC = p.colBoost && !lite
            val bLv = if (lite) 0 else p.beauty
            val bBr = floatArrayOf(0f, 0.05f, 0.09f, 0.14f)[bLv]
            val bSm = floatArrayOf(0f, 0.25f, 0.45f, 0.65f)[bLv]
            val gainG = p.gain
            val lut = FloatArray(1026)
            val lutK = 1024f / 255f

            init {
              for (i in 0..1025) {
                val x = Math.min(1f, i / 1024f)
                val s = x * x * (3f - 2f * x)
                lut[i] = 255f * (x + sCurve * (s - x))
              }
            }

            fun run(next: java.util.concurrent.atomic.AtomicInteger) {
              val maxN = w * (SH + 2 * M)
              val Y = FloatArray(maxN)
              val CB = FloatArray(maxN)
              val CR = FloatArray(maxN)
              val YD = FloatArray(maxN)
              val CBD = FloatArray(maxN)
              val CRD = FloatArray(maxN)
              val SIG = FloatArray(maxN)
              val M3 = FloatArray(maxN)
              val FW = ByteArray(maxN)
              val S = GScratch(maxN)
              val AY = S.a
              val k2 = kY * kY
              val faceCount = faces.size / 4
              val fSig = Algo.forceSigma
              // local copies for the hot loop
              val sharpAmt = this.sharpAmt
              val sharpAmt2 = sharpAmt * 0.35f
              val tone = this.tone
              val clar = this.clar
              val vib = this.vib
              val boostC = this.boostC
              val bLv = this.bLv
              val bBr = this.bBr
              val bSm = this.bSm
              val gainG = this.gainG
              val lut = this.lut
              val lutK = this.lutK
              val lg = this.lg
              val gs = this.gs
              val gw = this.gw
              val gh = this.gh
              val w = this.w
              val h = this.h
              val px = this.px
              val out = this.out
              while (true) {
                val si = next.getAndIncrement()
                if (si >= nStrips) break
                val y0 = si * SH
                val y1 = Math.min(h, y0 + SH)
                val a = Math.max(0, y0 - M)
                val b = Math.min(h, y1 + M)
                val sh = b - a
                val n = w * sh
                for (r in 0 until sh) {
                  val pb = (a + r) * w
                  val sb = r * w
                  for (x in 0 until w) {
                    val p0 = px[pb + x]
                    val rr = ((p0 shr 16) and 255).toFloat()
                    val gg = ((p0 shr 8) and 255).toFloat()
                    val bb = (p0 and 255).toFloat()
                    val yv = 0.299f * rr + 0.587f * gg + 0.114f * bb
                    Y[sb + x] = yv
                    CB[sb + x] = (bb - yv) * 0.564f
                    CR[sb + x] = (rr - yv) * 0.713f
                  }
                  nmap.fillRow(a + r, w, SIG, sb)
                }
                if (fSig > 0f) for (i in 0 until n) SIG[i] = fSig
                Algo.guidedSelf(Y, YD, w, sh, 2, SIG, k2, S)
                Algo.box(CB, CBD, S.t, w, sh, 5)
                Algo.box(CR, CRD, S.t, w, sh, 5)
                Algo.box(YD, M3, S.t, w, sh, 3)
                java.util.Arrays.fill(FW, 0, n, 0.toByte())
                if (bLv > 0) {
                  for (f in 0 until faceCount) {
                    val fl = faces[4 * f]
                    val ft = faces[4 * f + 1]
                    val fr = faces[4 * f + 2]
                    val fb = faces[4 * f + 3]
                    val cx = (fl + fr) / 2f
                    val cy = (ft + fb) / 2f - (fb - ft) * 0.04f
                    val rx = (fr - fl) * 0.62f
                    val ry = (fb - ft) * 0.72f
                    if (rx < 4f || ry < 4f) continue
                    val ya = Math.max(a, (cy - ry).toInt())
                    val yb = Math.min(b - 1, (cy + ry).toInt())
                    val xa = Math.max(0, (cx - rx).toInt())
                    val xb = Math.min(w - 1, (cx + rx).toInt())
                    for (yy in ya..yb) {
                      val dy = (yy - cy) / ry
                      for (xx in xa..xb) {
                        val dx = (xx - cx) / rx
                        val d = dx * dx + dy * dy
                        if (d < 1f) {
                          var v = (1f - d) * 2f
                          if (v > 1f) v = 1f
                          val iv = (v * 255f).toInt()
                          val k = (yy - a) * w + xx
                          if (iv > (FW[k].toInt() and 255)) FW[k] = iv.toByte()
                        }
                      }
                    }
                  }
                }
                for (yy in y0 until y1) {
                  val r = yy - a
                  val rowS = r * w
                  val rU = if (r > 0) rowS - w else rowS
                  val rD = if (r < sh - 1) rowS + w else rowS
                  val gyf = (yy + 0.5f) / gs - 0.5f
                  var gy0 = gyf.toInt()
                  if (gy0 < 0) gy0 = 0
                  if (gy0 > gh - 1) gy0 = gh - 1
                  val gy1 = Math.min(gh - 1, gy0 + 1)
                  var fy = gyf - gy0
                  if (fy < 0f) fy = 0f else if (fy > 1f) fy = 1f
                  for (x in 0 until w) {
                    val i = rowS + x
                    val xl = if (x > 0) x - 1 else x
                    val xr = if (x < w - 1) x + 1 else x
                    val c = YD[i]
                    val fwv = (FW[i].toInt() and 255) * (1f / 255f)
                    val ac = AY[i]
                    val flat = 1f - Math.max(0f, Math.min(1f, ac))
                    var base = c
                    if (fwv > 0f) base = c + (M3[i] - c) * bSm * fwv * flat
                    var ys = base
                    if (sharpAmt > 0f) {
                      val l = YD[rowS + xl]
                      val rg = YD[rowS + xr]
                      val u = YD[rU + x]
                      val d = YD[rD + x]
                      val ul = YD[rU + xl]
                      val ur = YD[rU + xr]
                      val dl = YD[rD + xl]
                      val dr = YD[rD + xr]
                      val bl = (4f * c + 2f * (l + rg + u + d) + ul + ur + dl + dr) * (1f / 16f)
                      var mn = c
                      var mx = c
                      if (l < mn) mn = l else if (l > mx) mx = l
                      if (rg < mn) mn = rg else if (rg > mx) mx = rg
                      if (u < mn) mn = u else if (u > mx) mx = u
                      if (d < mn) mn = d else if (d > mx) mx = d
                      if (ul < mn) mn = ul else if (ul > mx) mx = ul
                      if (ur < mn) mn = ur else if (ur > mx) mx = ur
                      if (dl < mn) mn = dl else if (dl > mx) mx = dl
                      if (dr < mn) mn = dr else if (dr > mx) mx = dr
                      val sres = 0.35f * SIG[i]
                      val th1 = 0.6f * sres + 0.3f
                      val th2 = 0.9f * sres + 0.4f
                      val det = c - bl
                      val ad = if (det < 0f) -det else det
                      val d1 = if (ad <= th1) 0f else det * (ad - th1) / ad
                      val det2 = c - M3[i]
                      val ad2 = if (det2 < 0f) -det2 else det2
                      val d2 = if (ad2 <= th2) 0f else det2 * (ad2 - th2) / ad2
                      val sa = 1f - 0.7f * fwv
                      ys = base + sa * (sharpAmt * d1 + sharpAmt2 * d2)
                      if (ys > mx + 3f) ys = mx + 3f
                      if (ys < mn - 3f) ys = mn - 3f
                    }
                    if (ys < 0f) ys = 0f else if (ys > 255f) ys = 255f
                    val y01 = ys * (1f / 255f)
                    var loc = 0.5f
                    var g = 1f
                    if (tone > 0f || clar > 0f) {
                      val gxf = (x + 0.5f) / gs - 0.5f
                      var gx0 = gxf.toInt()
                      if (gx0 < 0) gx0 = 0
                      if (gx0 > gw - 1) gx0 = gw - 1
                      val gx1 = Math.min(gw - 1, gx0 + 1)
                      var fx = gxf - gx0
                      if (fx < 0f) fx = 0f else if (fx > 1f) fx = 1f
                      loc = (lg[gy0 * gw + gx0] * (1f - fx) + lg[gy0 * gw + gx1] * fx) * (1f - fy) +
                        (lg[gy1 * gw + gx0] * (1f - fx) + lg[gy1 * gw + gx1] * fx) * fy
                      val dk = 1f - loc
                      g = 1f + 0.28f * tone * dk * dk * dk
                      g *= 1f - 0.11f * tone * Algo.ss(0.6f, 0.92f, loc) * (1f - Algo.ss(0.90f, 0.99f, y01))
                    }
                    if (gainG < 1f) g *= gainG + (1f - gainG) * Algo.ss(0.7f, 1f, y01)
                    var y2 = ys * g
                    if (clar > 0f) {
                      var cd = clar * (y2 - loc * 255f * g) * (4f * y01 * (1f - y01))
                      if (cd > 18f) cd = 18f else if (cd < -18f) cd = -18f
                      y2 += cd
                    }
                    if (y2 < 0f) y2 = 0f else if (y2 > 255f) y2 = 255f
                    val lf = y2 * lutK
                    val li = lf.toInt()
                    val lr = lf - li
                    var yL = lut[li] * (1f - lr) + lut[li + 1] * lr
                    // chroma: smoothed where the luma is flat (noise), untouched where there is an edge
                    val wC = 1f - Algo.ss(0.30f, 0.75f, ac)
                    val cbv = CB[i] + (CBD[i] - CB[i]) * wC
                    val crv = CR[i] + (CRD[i] - CR[i]) * wC
                    val skin = cbv >= -51f && cbv <= -1f && crv >= 5f && crv <= 45f
