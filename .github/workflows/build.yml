              pTitle.alpha = (255f * a).toInt()
              cv.drawText("Pro Cam", w / 2f, h * 0.5f - 6f * dn, pTitle)
              cv.restore()
              pSub.alpha = (200f * ss(0.1f, 0.4f, t)).toInt()
              cv.drawText("CAMERA", w / 2f, h * 0.5f + 22f * dn, pSub)
              val sp = ss(0.30f, 0.92f, t)
              if (sp > 0f && sigLen > 0f) {
