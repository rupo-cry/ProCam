          package com.rupom.procam

          // ===== astronomy / night-sky helpers (pure Kotlin, no Android APIs) =====
          object Astro {
            private fun dither(x: Int, y: Int): Float {
              var hh = x * 374761393 + y * 668265263
              hh = (hh xor (hh ushr 13)) * 1274126177
              hh = hh xor (hh ushr 16)
              return (hh and 255) * (1f / 255f) - 0.5f
            }

            private fun lumaAt(p: Int): Int = (((p shr 16) and 255) * 77 + ((p shr 8) and 255) * 151 + (p and 255) * 28) shr 8

            // star trails: running per-channel maximum (lighten blend). acc and f must have the same size.
            fun maxInto(acc: IntArray, f: IntArray) {
              for (i in acc.indices) {
                val a = acc[i]
                val b = f[i]
                var r = (a shr 16) and 255
                var g = (a shr 8) and 255
                var bl = a and 255
                val r2 = (b shr 16) and 255
                val g2 = (b shr 8) and 255
                val b2 = b and 255
                if (r2 > r) r = r2
                if (g2 > g) g = g2
                if (b2 > bl) bl = b2
                acc[i] = (255 shl 24) or (r shl 16) or (g shl 8) or bl
              }
            }

            // percentile (0..1) of a 256 bin histogram
            private fun pct(hist: IntArray, total: Int, q: Float): Int {
              val target = (total * q).toInt()
              var acc = 0
              for (i in 0..255) {
                acc += hist[i]
                if (acc > target) return i
              }
              return 255
            }

            // median luma of the frame (0..255), sampled
            fun skyLevel(px: IntArray, w: Int, h: Int): Int {
              val hist = IntArray(256)
              var n = 0
              var y = 0
              while (y < h) {
                var x = 0
                while (x < w) {
                  hist[lumaAt(px[y * w + x])]++
                  n++
                  x += 5
                }
                y += 5
              }
              return pct(hist, n, 0.5f)
            }

            // single-pixel hot spots (isolated, much brighter than all 8 neighbours) are replaced by the neighbour average
            fun despeckle(px: IntArray, w: Int, h: Int) {
              val l = Merge.luma8(px, w, h)
              for (y in 1 until h - 1) {
                for (x in 1 until w - 1) {
                  val i = y * w + x
                  val c = l[i].toInt() and 255
                  if (c < 40) continue
                  var mx = 0
                  var sum = 0
                  for (dy in -1..1) {
                    for (dx in -1..1) {
                      if (dx == 0 && dy == 0) continue
                      val v = l[i + dy * w + dx].toInt() and 255
                      sum += v
                      if (v > mx) mx = v
                    }
                  }
                  if (c - mx >= 28 && sum < 8 * 0.4f * c) {
                    var r = 0
                    var g = 0
                    var b = 0
                    for (dy in -1..1) {
                      for (dx in -1..1) {
                        if (dx == 0 && dy == 0) continue
                        val p = px[i + dy * w + dx]
                        r += (p shr 16) and 255
                        g += (p shr 8) and 255
                        b += p and 255
                      }
                    }
                    px[i] = (255 shl 24) or ((r shr 3) shl 16) or ((g shr 3) shl 8) or (b shr 3)
                  }
                }
              }
            }

            // night sky: per-channel background level (removes colour cast of the sky glow), gamma stretch, mild colour boost
            fun skyStretch(px: IntArray, w: Int, h: Int, lift: Float, gamma: Float, sat: Float) {
              val hr = IntArray(256)
              val hg = IntArray(256)
              val hb = IntArray(256)
              var n = 0
              var y = 0
              while (y < h) {
                var x = 0
                while (x < w) {
                  val p = px[y * w + x]
                  hr[(p shr 16) and 255]++
                  hg[(p shr 8) and 255]++
                  hb[p and 255]++
                  n++
                  x += 3
                }
                y += 3
              }
              val bpR = pct(hr, n, 0.30f).toFloat()
              val bpG = pct(hg, n, 0.30f).toFloat()
              val bpB = pct(hb, n, 0.30f).toFloat()
              val lutR = FloatArray(256)
              val lutG = FloatArray(256)
              val lutB = FloatArray(256)
              for (v in 0..255) {
                lutR[v] = lift + (255f - lift) * Math.pow(Math.max(0.0, ((v - bpR) / (255f - bpR)).toDouble()), gamma.toDouble()).toFloat()
                lutG[v] = lift + (255f - lift) * Math.pow(Math.max(0.0, ((v - bpG) / (255f - bpG)).toDouble()), gamma.toDouble()).toFloat()
                lutB[v] = lift + (255f - lift) * Math.pow(Math.max(0.0, ((v - bpB) / (255f - bpB)).toDouble()), gamma.toDouble()).toFloat()
              }
              for (y in 0 until h) {
                for (x in 0 until w) {
                  val i = y * w + x
                  val p = px[i]
                  var r = lutR[(p shr 16) and 255]
                  var g = lutG[(p shr 8) and 255]
                  var b = lutB[p and 255]
                  val yv = 0.299f * r + 0.587f * g + 0.114f * b
                  val d = dither(x, y)
                  r = yv + (r - yv) * sat + d
                  g = yv + (g - yv) * sat + d
                  b = yv + (b - yv) * sat + d
                  px[i] = (255 shl 24) or (Algo.c8(r) shl 16) or (Algo.c8(g) shl 8) or Algo.c8(b)
                }
              }
            }

            // moon: black sky, bright disc mapped near white, gentle contrast, mostly neutral colour
            fun moonStretch(px: IntArray, w: Int, h: Int) {
              val hist = IntArray(256)
              var n = 0
              var y = 0
              while (y < h) {
                var x = 0
                while (x < w) {
                  hist[lumaAt(px[y * w + x])]++
                  n++
                  x += 3
                }
                y += 3
              }
              val bp = Math.min(pct(hist, n, 0.5f) + 2, 40).toFloat()
              val wp = Math.max(pct(hist, n, 0.998f).toFloat(), bp + 40f)
              var scale = (246f - bp) / (wp - bp)
              if (scale < 0.9f) scale = 0.9f
              if (scale > 3f) scale = 3f
              val lut = FloatArray(256)
              for (v in 0..255) {
                var t = (v - bp) * scale / 255f
                if (t < 0f) t = 0f
                if (t > 1f) t = 1f
                val s = t * t * (3f - 2f * t)
                lut[v] = 255f * (t + 0.25f * (s - t))
              }
              for (y in 0 until h) {
                for (x in 0 until w) {
                  val i = y * w + x
                  val p = px[i]
                  var r = lut[(p shr 16) and 255]
                  var g = lut[(p shr 8) and 255]
                  var b = lut[p and 255]
                  val yv = 0.299f * r + 0.587f * g + 0.114f * b
                  val d = dither(x, y)
                  r = yv + (r - yv) * 0.45f + d
                  g = yv + (g - yv) * 0.45f + d
                  b = yv + (b - yv) * 0.45f + d
                  px[i] = (255 shl 24) or (Algo.c8(r) shl 16) or (Algo.c8(g) shl 8) or Algo.c8(b)
                }
              }
            }

            // clockwise rotation of an image by 0 / 90 / 180 / 270 degrees (same as Matrix.postRotate)
            fun rotateInts(px: IntArray, w: Int, h: Int, rot: Int): IntArray {
              val r = ((rot % 360) + 360) % 360
              if (r == 0) return px
              val o = IntArray(w * h)
              if (r == 90) {
                for (y in 0 until h) for (x in 0 until w) o[x * h + (h - 1 - y)] = px[y * w + x]
              } else if (r == 180) {
                for (y in 0 until h) for (x in 0 until w) o[(h - 1 - y) * w + (w - 1 - x)] = px[y * w + x]
              } else {
                for (y in 0 until h) for (x in 0 until w) o[(w - 1 - x) * h + y] = px[y * w + x]
              }
              return o
            }
          }
