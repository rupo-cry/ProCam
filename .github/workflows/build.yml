            }

            private fun loadLastThumb() {
              Thread {
                try {
                  var best: Uri? = null
                  var bestT = -1L
                  var bestMime = "image/*"
                  val sources = listOf(
                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI to "image/*",
                    MediaStore.Video.Media.EXTERNAL_CONTENT_URI to "video/*"
                  )
                  for ((base, mm) in sources) {
                    val c = contentResolver.query(
                      base,
                      arrayOf(MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DATE_ADDED),
                      MediaStore.MediaColumns.DISPLAY_NAME + " LIKE ?",
                      arrayOf("ProCam_%"),
                      MediaStore.MediaColumns.DATE_ADDED + " DESC"
                    )
                    if (c != null) {
                      if (c.moveToFirst()) {
                        val t = c.getLong(1)
                        if (t > bestT) { bestT = t; best = ContentUris.withAppendedId(base, c.getLong(0)); bestMime = mm }
                      }
                      c.close()
                    }
                  }
                  val u = best
                  if (u != null) {
                    val bm = contentResolver.loadThumbnail(u, Size(256, 256), null)
                    runOnUiThread { lastUri = u; lastMime = bestMime; thumb.setImageBitmap(bm) }
                  }
                } catch (e: Exception) { }
              }.start()
            }

            override fun onResume() {
              super.onResume()
              if (!camStarted && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera()
              if (mode == 4 || mode == 5) gyroSet(true)
            }

            override fun onStop() {
              super.onStop()
              saveSettings()
              gyroSet(false)
              if (burstOn) {
                burstStopReq = true
                if (!burstInFlight) burstFinish()
              }
              if (counting) {
                counting = false
                handler.removeCallbacksAndMessages(null)
                info.text = ""
              }
              pendingFlip = false
              recording?.stop()
            }

            override fun onDestroy() {
              handler.removeCallbacksAndMessages(null)
              super.onDestroy()
            }

            override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
              if ((keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) && settingsView.visibility != View.VISIBLE) {
                if ((event?.repeatCount ?: 0) == 0) onShutter()
                return true
              }
              return super.onKeyDown(keyCode, event)
            }

            override fun onConfigurationChanged(c: Configuration) {
              super.onConfigurationChanged(c)
              @Suppress("DEPRECATION")
              val r = windowManager.defaultDisplay.rotation
              prev?.targetRotation = r
              img?.targetRotation = r
              if (recording == null) vc?.targetRotation = r
              if (mode == 1 && vRatio >= 2 && recording == null) rebind()
            }

            private fun toast(m: String) {
              toastV.text = m
              reveal(toastV, true)
              handler.removeCallbacks(hideToast)
              handler.postDelayed(hideToast, 2500)
            }

            private fun openLast() {
              val u = lastUri ?: return
              try {
                startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(u, lastMime).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
              } catch (e: Exception) { toast("No gallery app found") }
            }

            private fun saved(uri: Uri?, mime: String, msg: String) {
              if (uri == null) return
              lastUri = uri
              lastMime = mime
              toast("$msg\nTap to view")
              Thread {
                try {
                  val bm = contentResolver.loadThumbnail(uri, Size(256, 256), null)
                  runOnUiThread { thumb.setImageBitmap(bm); pop(thumb) }
                } catch (e: Exception) { }
              }.start()
            }

            private val zoomStep = object : Runnable {
              override fun run() {
                if (!zRunning) return
                val d = zTarget - zCur
                if (Math.abs(d) < 0.002f * zCur) { zCur = zTarget; zRunning = false } else zCur += d * 0.1f
                camera?.cameraControl?.setZoomRatio(zCur)
                syncZoomUI()
                if (zRunning) pv.postOnAnimation(this)
              }
            }

            private fun zoomTo(r: Float, dial: Boolean = false) {
              if (burstOn) return
              zTarget = r.coerceIn(zmin, zmax)
              if (dial) showDial()
              if (!zRunning) { zRunning = true; pv.postOnAnimation(zoomStep) }
            }

            private fun zoomName(k: Int): String {
              val z = zoomVals[k]
              return if (z == z.toInt().toFloat()) "${z.toInt()}" else "$z"
            }

            private fun showDial() {
              pv.removeCallbacks(hideDialR)
              pv.postDelayed(hideDialR, 1400)
              if (!dialOn) setDial(true)
            }

            private fun setDial(on: Boolean) {
              dialOn = on
              zoomWheel.animate().cancel()
              zoomLabel.animate().cancel()
              zoomRow.animate().cancel()
              if (on) {
                for (v in arrayOf<View>(zoomWheel, zoomLabel)) {
                  v.alpha = 0f
                  v.visibility = View.VISIBLE
                  v.animate().alpha(1f).setDuration(180).start()
                }
                zoomRow.animate().alpha(0f).setDuration(150).withEndAction { zoomRow.visibility = View.INVISIBLE }.start()
              } else {
                for (v in arrayOf<View>(zoomWheel, zoomLabel)) {
                  v.animate().alpha(0f).setDuration(220).withEndAction { v.visibility = View.GONE }.start()
                }
                zoomRow.alpha = 0f
                zoomRow.visibility = View.VISIBLE
                zoomRow.animate().alpha(1f).setDuration(220).start()
              }
            }

            private fun setPanel(open: Boolean) {
              expOpen = open
              chevChip.text = if (open) "⌃" else "⌄"
              expPanel.animate().cancel()
              if (open) {
                expPanel.alpha = 0f
                expPanel.visibility = View.VISIBLE
                expPanel.animate().alpha(1f).setDuration(200).start()
              } else {
                expPanel.animate().alpha(0f).setDuration(150).withEndAction { expPanel.visibility = View.GONE }.start()
              }
            }

            private fun syncZoomUI() {
              zoomLabel.text = String.format("%.1fX", zCur)
              zoomWheel.zmin = zmin
              zoomWheel.zmax = zmax
              zoomWheel.cur = zCur
              zoomWheel.invalidate()
              var sel = -1
              for (k in zoomVals.indices) if (zoomVals[k] <= zCur + 0.04f) sel = k
              for (k in zoomChips.indices) {
                val t = if (k != sel) zoomName(k) else if (Math.abs(zoomVals[k] - zCur) < 0.05f) zoomName(k) + "X" else String.format("%.1fX", zCur)
                if (zoomChips[k].text.toString() != t) zoomChips[k].text = t
              }
              if (sel != lastSel) {
                lastSel = sel
                for (k in zoomChips.indices) {
                  zoomChips[k].background = if (k == sel) bg(Color.parseColor("#33FFFFFF"), 20, Color.WHITE, 2) else null
                }
              }
            }

            private fun applyRefresh() {
              try {
                @Suppress("DEPRECATION")
                val d = windowManager.defaultDisplay
                val cur = d.mode
                val modes = d.supportedModes.filter { it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
                hzMax = modes.maxOfOrNull { it.refreshRate }?.toInt() ?: 60
                val best = (if (maxHz) modes.maxByOrNull { it.refreshRate } else modes.minByOrNull { Math.abs(it.refreshRate - 60f) }) ?: return
                val a = window.attributes
                a.preferredDisplayModeId = best.modeId
                a.preferredRefreshRate = best.refreshRate
                window.attributes = a
              } catch (e: Exception) { }
            }

            private fun openSettings() {
              if (burstOn) {
                toast("Busy, wait for the shot to finish")
                return
              }
              if (expOpen) setPanel(false)
              val v = mode == 1
              settingsTitle.text = if (v) "←  Video Settings" else "←  Photo Settings"
              videoBox.visibility = if (v) View.VISIBLE else View.GONE
              photoBox.visibility = if (v) View.GONE else View.VISIBLE
              refreshers.forEach { it() }
              reveal(settingsView, true)
            }

            private fun markZoom(i: Int) { for (k in zoomChips.indices) mark(zoomChips[k], k == i) }

            private fun updateResChip() {
              resChip.text = if (mode == 1) resS[resIdx] else if (ratio169) "16:9" else "4:3"
            }

            private fun updateShutter() {
              val rec = recording != null || burstOn
              val red = mode == 1 || rec
              shutter.background = bg(if (red) RED else Color.WHITE, if (rec) 18 else 38, if (red) Color.WHITE else RED, 5)
              shutter.animate().scaleX(if (rec) 0.88f else 1f).scaleY(if (rec) 0.88f else 1f).setDuration(220).start()
            }

            private fun refreshPro() {
              isoChip.text = if (manExp) "ISO\n$iso" else "ISO\nAuto"
              shChip.text = if (manExp) "S\n${shDen.getOrNull(shSb.progress)?.let { "1/$it" } ?: "-"}" else "S\nAuto"
              wbChip.text = if (manWb) "WB\n${wbNames[wbIdx]}" else "WB\nAuto"
              mark(isoChip, manExp)
              mark(shChip, manExp)
              mark(wbChip, manWb)
            }

            private fun setMode(m: Int) {
              if (recording != null || counting || burstOn) return
              mode = m
              if (m != 2) { manExp = false; manWb = false; wasManual = false }
              for (i in modeChips.indices) mark(modeChips[i], modeIds[i] == m)
              val mi = modeIds.indexOf(m)
              if (mi >= 0 && mi < modeChips.size) {
                val cc = modeChips[mi]
                modeScroll.post { modeScroll.smoothScrollTo(cc.left + cc.width / 2 - modeScroll.width / 2, 0) }
              }
              reveal(proPanel, m == 2)
              ring.reset()
              ring.visibility = if (m == 4 || m == 5) View.VISIBLE else View.GONE
              gyroSet(m == 4 || m == 5)
              buildRatioRow()
              updateResChip()
              updateShutter()
              refreshPro()
              rebind()
            }

            private fun toggleHdr() {
              if (!hdrOk) { toast("HDR not supported on this camera"); return }
              hdr = !hdr
              mark(hdrChip, hdr)
              applyManual()
            }

            private fun applyFlash() {
              img?.flashMode = flashModes[flash]
              camera?.cameraControl?.enableTorch(mode == 1 && flash == 2)
            }

            private fun tapFocus(x: Float, y: Float) {
              if (burstOn) return
              val pt = pv.meteringPointFactory.createPoint(x, y)
              camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(pt).build())
              focusBox.animate().cancel()
              focusBox.x = x - dp(36)
              focusBox.y = y - dp(36)
              focusBox.visibility = View.VISIBLE
              focusBox.alpha = 1f
              focusBox.scaleX = 1.5f
              focusBox.scaleY = 1.5f
              focusBox.animate().setStartDelay(0).scaleX(1f).scaleY(1f).setDuration(220).setInterpolator(DecelerateInterpolator())
                .withEndAction {
                  focusBox.animate().setStartDelay(650).alpha(0f).setDuration(250).withEndAction { focusBox.visibility = View.GONE }.start()
                }.start()
            }

            private fun isoFor(p: Int): Int = (isoLo * Math.pow(isoHi.toDouble() / isoLo, p / 100.0)).toInt()

            private fun startCamera() {
              if (camStarted) return
              camStarted = true
              val f = ProcessCameraProvider.getInstance(this)
              f.addListener({
                provider = f.get()
                rebind()
                try {
                  val ef = ExtensionsManager.getInstanceAsync(this, provider!!)
                  ef.addListener({
                    try { extMgr = ef.get(); if (mode == 3) rebind() } catch (e: Exception) { }
                  }, ContextCompat.getMainExecutor(this))
                } catch (e: Exception) { }
              }, ContextCompat.getMainExecutor(this))
            }

            private fun rebind() {
              val p = provider ?: return
              if (burstOn) return
              p.unbindAll()
              aeNs = 0L
              aeIso = 0
              fadePreview()
              img = null
              vc = null
              val fps = resF[resIdx]
              val range = Range(fps, fps)
              val ar = if (mode == 1) (if (vRatio == 1) AspectRatio.RATIO_4_3 else AspectRatio.RATIO_16_9) else if (ratio169) AspectRatio.RATIO_16_9 else AspectRatio.RATIO_4_3
              val pb = Preview.Builder().setTargetAspectRatio(ar)
              if (mode == 1) {
                pb.setTargetFrameRate(range)
                Camera2Interop.Extender(pb).setCaptureRequestOption(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, range)
              }
              if (mode == 4 || mode == 5) Camera2Interop.Extender(pb).setSessionCaptureCallback(aeWatch)
              val preview = pb.build()
              preview.setSurfaceProvider(pv.surfaceProvider)
              prev = preview
              try {
                var sel = if (back) CameraSelector.DEFAULT_BACK_CAMERA else CameraSelector.DEFAULT_FRONT_CAMERA
                hwBokeh = false
                val em = extMgr
                if (mode == 3 && em != null && em.isExtensionAvailable(sel, ExtensionMode.BOKEH)) {
                  sel = em.getExtensionEnabledCameraSelector(sel, ExtensionMode.BOKEH)
                  hwBokeh = true
                }
                val cam: Camera
                if (mode == 1) {
                  val q = resQ[resIdx]
                  val rb = Recorder.Builder().setQualitySelector(QualitySelector.from(q, FallbackStrategy.lowerQualityOrHigherThan(q))).setAspectRatio(ar)
                  val br = if (rawVideo) Math.max(rates[ri], if (resIdx == 2) 120 else 80) else rates[ri]
                  if (br > 0) rb.setTargetVideoEncodingBitRate(br * 1_000_000)
                  val vb = VideoCapture.Builder(rb.build()).setTargetFrameRate(range)
                  val ex = Camera2Interop.Extender(vb)
                  ex.setCaptureRequestOption(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, range)
                  if (stab) ex.setCaptureRequestOption(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON)
                  val cap = vb.build()
                  vc = cap
                  cam = if (vRatio >= 2) {
                    val land = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                    val rat = if (vRatio == 3) Rational(1, 1) else if (land) Rational(21, 9) else Rational(9, 21)
                    @Suppress("DEPRECATION")
                    val rot = windowManager.defaultDisplay.rotation
                    val grp = UseCaseGroup.Builder().setViewPort(ViewPort.Builder(rat, rot).build()).addUseCase(preview).addUseCase(cap).build()
                    p.bindToLifecycle(this, sel, grp)
                  } else p.bindToLifecycle(this, sel, preview, cap)
                } else {
                  val ic = ImageCapture.Builder()
                    .setCaptureMode(if (hq) ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY else ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                    .setTargetAspectRatio(ar).build()
                  img = ic
                  cam = p.bindToLifecycle(this, sel, preview, ic)
                }
                camera = cam
                readCaps(cam)
                applyFlash()
                applyManual()
                zCur = 1f
                zTarget = 1f
                zRunning = false
                lastSel = -2
                syncZoomUI()
                if (mode == 3) zoomTo(portraitZoom) else if (mode == 5 && astroSub == 0) zoomTo(Math.min(zmax, 8f))
                info.text = modeInfo()
              } catch (e: Exception) {
                if (mode == 1 && resF[resIdx] == 60) {
                  resIdx += 1
                  updateResChip()
                  rebind()
                  toast("60fps failed here, using 30fps")
                } else info.text = "Error: ${e.message}"
              }
            }

            private fun readCaps(cam: Camera) {
              val es = cam.cameraInfo.exposureState
              val er = es.exposureCompensationRange
              evLo = er.lower
              evStep = es.exposureCompensationStep.toFloat()
              evSb.max = er.upper - er.lower
              evSb.progress = -er.lower
              val zs = cam.cameraInfo.zoomState.value
              zmin = zs?.minZoomRatio ?: 1f
              zmax = zs?.maxZoomRatio ?: 1f
              for (i in zoomVals.indices) {
                zoomChips[i].visibility = if (zoomVals[i] >= zmin - 0.01f && zoomVals[i] <= zmax) View.VISIBLE else View.GONE
              }
              try {
                val ci = Camera2CameraInfo.from(cam.cameraInfo)
                val ir = ci.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE)
                if (ir != null) { isoLo = ir.lower; isoHi = minOf(ir.upper, 6400) }
                val tr = ci.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE)
                if (tr != null) {
                  expLo = tr.lower
                  expHi = tr.upper
                }
                hasOis = ci.getCameraCharacteristic(CameraCharacteristics.LENS_INFO_AVAILABLE_OPTICAL_STABILIZATION)
                  ?.contains(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON) == true
                manualCap = ci.getCameraCharacteristic(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES)
                  ?.contains(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR) == true
                maxFrameNs = ci.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_MAX_FRAME_DURATION) ?: 0L
                apertureF = ci.getCameraCharacteristic(CameraCharacteristics.LENS_INFO_AVAILABLE_APERTURES)?.firstOrNull() ?: 0f
                minFocus = ci.getCameraCharacteristic(CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE) ?: 0f
                val dens = listOf(8000, 4000, 2000, 1000, 500, 250, 125, 60, 30, 15, 8, 4)
                val fps = resF[resIdx]
                shDen = dens.filter { d ->
                  val ns = 1_000_000_000L / d
                  (mode != 1 || d >= fps) && (tr == null || (ns >= tr.lower && ns <= tr.upper))
                }
                hdrOk = ci.getCameraCharacteristic(CameraCharacteristics.CONTROL_AVAILABLE_SCENE_MODES)
                  ?.contains(CaptureRequest.CONTROL_SCENE_MODE_HDR) == true
              } catch (e: Exception) {
                shDen = listOf()
                hdrOk = false
                hasOis = false
                manualCap = false
              }
              shSb.max = maxOf(shDen.size - 1, 0)
              shSb.progress = shDen.indexOf(125).coerceAtLeast(0)
              isoSb.progress = 30
              wbSb.progress = 2
              iso = isoFor(isoSb.progress)
              if (shDen.isNotEmpty()) expNs = 1_000_000_000L / shDen[shSb.progress.coerceIn(0, shDen.size - 1)]
              wbIdx = wbSb.progress
              refreshPro()
            }

            private fun flatOn(): Boolean = if (mode == 1) rawVideo else (rawPhoto && (mode == 0 || mode == 2))

            private fun flatY(x: Float): Float {
              val s = if (x <= 0.0031308f) 12.92f * x else (1.055 * Math.pow(x.toDouble(), 1.0 / 2.4) - 0.055).toFloat()
              return 0.06f + 0.86f * (s * (1.12f - 0.12f * s))
            }

            private fun flatOpts(cam: Camera, b: CaptureRequestOptions.Builder) {
              try {
                val ci = Camera2CameraInfo.from(cam.cameraInfo)
                val nr = ci.getCameraCharacteristic(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES)
                if (nr != null && nr.contains(CaptureRequest.NOISE_REDUCTION_MODE_OFF)) {
                  b.setCaptureRequestOption(CaptureRequest.NOISE_REDUCTION_MODE, CaptureRequest.NOISE_REDUCTION_MODE_OFF)
                }
                val ed = ci.getCameraCharacteristic(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES)
                if (ed != null && ed.contains(CaptureRequest.EDGE_MODE_OFF)) {
                  b.setCaptureRequestOption(CaptureRequest.EDGE_MODE, CaptureRequest.EDGE_MODE_OFF)
                }
                if (mode == 1) {
                  val tm = ci.getCameraCharacteristic(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES)
                  if (tm != null && tm.contains(CaptureRequest.TONEMAP_MODE_CONTRAST_CURVE)) {
                    val pts = FloatArray(66)
                    for (i in 0..32) {
                      val x = i / 32f
                      pts[2 * i] = x
                      pts[2 * i + 1] = flatY(x)
                    }
                    b.setCaptureRequestOption(CaptureRequest.TONEMAP_MODE, CaptureRequest.TONEMAP_MODE_CONTRAST_CURVE)
                    b.setCaptureRequestOption(CaptureRequest.TONEMAP_CURVE, TonemapCurve(pts.copyOf(), pts.copyOf(), pts.copyOf()))
                  }
                }
              } catch (e: Throwable) {
              }
            }

            private fun applyManual() {
              val cam = camera ?: return
              try {
                val c2 = Camera2CameraControl.from(cam.cameraControl)
                val flat = flatOn()
                if (!manExp && !manWb && !hdr && !flat) {
                  if (wasManual) c2.clearCaptureRequestOptions()
                  wasManual = false
                  return
                }
                val b = CaptureRequestOptions.Builder()
                if (manExp) {
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_OFF)
                  b.setCaptureRequestOption(CaptureRequest.SENSOR_SENSITIVITY, iso)
                  b.setCaptureRequestOption(CaptureRequest.SENSOR_EXPOSURE_TIME, expNs)
                }
                if (manWb) b.setCaptureRequestOption(CaptureRequest.CONTROL_AWB_MODE, wbModes[wbIdx])
                if (hdr) {
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_MODE, CaptureRequest.CONTROL_MODE_USE_SCENE_MODE)
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_SCENE_MODE, CaptureRequest.CONTROL_SCENE_MODE_HDR)
                }
                if (flat) flatOpts(cam, b)
                c2.setCaptureRequestOptions(b.build())
                wasManual = true
              } catch (e: Exception) {
                info.text = "Manual not supported: ${e.message}"
              }
            }

            private fun onShutter() {
              shutter.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
              if (counting) {
                counting = false
                handler.removeCallbacksAndMessages(null)
                info.text = modeInfo()
                return
              }
              if (burstOn) {
                burstStop()
                return
              }
              if (mode == 1) {
                val r = recording
                if (r != null) { r.stop(); return }
                if (timerSec > 0) { counting = true; countdown(timerSec) { startRec() } } else startRec()
              } else {
                if (timerSec > 0) { counting = true; countdown(timerSec) { shootNow() } } else shootNow()
              }
            }

            private fun shootNow() {
              if (mode == 4 || mode == 5) burstStart() else takePhoto()
            }

            private fun countdown(n: Int, done: () -> Unit) {
              if (!counting) return
              if (n == 0) {
                counting = false
                info.text = ""
                done()
                return
              }
              info.text = "$n"
              info.scaleX = 1.8f
              info.scaleY = 1.8f
              info.animate().scaleX(1f).scaleY(1f).setDuration(600).setInterpolator(DecelerateInterpolator()).start()
              handler.postDelayed({ countdown(n - 1, done) }, 1000)
            }

            private fun takePhoto() {
              val ic = img ?: return
              flashView.alpha = 0.8f
              flashView.animate().alpha(0f).setDuration(260).start()
              val z = zCur
              ic.takePicture(ContextCompat.getMainExecutor(this), object : ImageCapture.OnImageCapturedCallback() {
                override fun onCaptureSuccess(image: ImageProxy) {
                  val buf = image.planes[0].buffer
                  val bytes = ByteArray(buf.remaining())
                  buf.get(bytes)
                  val rot = image.imageInfo.rotationDegrees
                  image.close()
                  if (!(rawPhoto && (mode == 0 || mode == 2))) toast("Processing...")
                  Thread { processAndSave(bytes, rot, z, mode) }.start()
                }
                override fun onError(e: ImageCaptureException) { toast("Error: ${e.message}") }
              })
            }

            private fun processAndSave(bytes: ByteArray, rot: Int, z: Float, md: Int) {
              try {
                var out = bytes
                val raw = rawPhoto && (md == 0 || md == 2)
                if (!raw) {
                  synchronized(heavy) {
                    var bmp = decodeLimited(bytes, sizeLimit(md)) ?: return
                    if (rot != 0) {
                      val mx = Matrix()
                      mx.postRotate(rot.toFloat())
                      val rb = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, mx, true)
                      if (rb !== bmp) bmp.recycle()
                      bmp = rb
                    }
                    val usePortrait = md == 3 && !hwBokeh
                    val faces = if (usePortrait || (procOn && beautyLv > 0)) detectFaces(bmp) else emptyList<Rect>()
                    if (usePortrait) {
                      val r = try { portrait(bmp, faces) } catch (e: Throwable) { null }
                      if (r != null) {
                        bmp.recycle()
                        bmp = r
                      } else runOnUiThread { toast("No person found, saved without blur") }
                    }
                    val w = bmp.width
                    val h = bmp.height
                    val px = IntArray(w * h)
                    bmp.getPixels(px, 0, w, 0, 0, w, h)
                    bmp.recycle()
                    out = jpegOf(enhanceInts(px, w, h, photoParams(z), faces), w, h)
                  }
                }
                saveJpeg(out, if (raw) "RAW Photo Saved" else if (md == 3) "Portrait Saved" else "Photo Saved")
              } catch (e: Throwable) {
                runOnUiThread { toast("Error: ${e.message}") }
              }
            }

            // ---------- startup animation ----------
            private fun startIntro(root: FrameLayout) {
              val iv = IntroView(this)
              iv.setBackgroundColor(Color.parseColor("#0B0712"))
              iv.isClickable = true
              root.addView(iv, FrameLayout.LayoutParams(-1, -1))
              val a = ValueAnimator.ofFloat(0f, 1f)
              a.duration = 520
              a.interpolator = android.view.animation.LinearInterpolator()
              a.addUpdateListener { v ->
                iv.t = v.animatedValue as Float
                iv.invalidate()
              }
              a.addListener(object : android.animation.AnimatorListenerAdapter() {
                override fun onAnimationEnd(animation: android.animation.Animator) {
                  iv.animate().alpha(0f).setDuration(160).withEndAction { root.removeView(iv) }.start()
                }
              })
              iv.setOnClickListener { a.end() }
              a.start()
            }

            // ---------- live sensors (gyro, auto-exposure values from the preview) ----------
            private val gyroL = object : SensorEventListener {
              override fun onSensorChanged(e: SensorEvent) {
                val x = e.values[0]
                val y = e.values[1]
                val z = e.values[2]
                val m = Math.sqrt((x * x + y * y + z * z).toDouble()).toFloat()
                omegaFast = if (omegaFast < 0f) m else omegaFast + (m - omegaFast) * 0.25f
                omegaSlow = if (omegaSlow < 0f) m else omegaSlow + (m - omegaSlow) * 0.06f
                if (omegaFast > burstMaxOmega) burstMaxOmega = omegaFast
              }

              override fun onAccuracyChanged(s: Sensor?, a: Int) {}
            }

            private fun gyroSet(on: Boolean) {
              try {
                if (on && !gyroOn) {
                  val m = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  sm = m
                  val g = m.getDefaultSensor(Sensor.TYPE_GYROSCOPE)
                  if (g != null) gyroOn = m.registerListener(gyroL, g, SensorManager.SENSOR_DELAY_GAME)
                } else if (!on && gyroOn) {
                  sm?.unregisterListener(gyroL)
                  gyroOn = false
                  omegaFast = -1f
                  omegaSlow = -1f
                }
              } catch (e: Exception) {
                gyroOn = false
              }
            }

            private val aeWatch = object : CameraCaptureSession.CaptureCallback() {
              override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) {
                val fd = result.get(CaptureResult.LENS_FOCUS_DISTANCE)
                if (fd != null) focusDist = fd
                val am = result.get(CaptureResult.CONTROL_AE_MODE)
                if (am != null && am != CaptureRequest.CONTROL_AE_MODE_OFF) {
                  val t = result.get(CaptureResult.SENSOR_EXPOSURE_TIME)
                  val s = result.get(CaptureResult.SENSOR_SENSITIVITY)
                  if (t != null && s != null) {
                    aeNs = t
                    aeIso = s
                  }
                }
              }
            }

            private fun modeInfo(): String {
              if (mode == 1) return resN[resIdx] + (if (rawVideo) " RAW" else "")
              if (mode == 3) return if (hwBokeh) "Portrait: hardware blur" else "Portrait: software blur"
              if (mode == 4) return "Enhanced photo" + (if (hasOis) "  |  OIS" else "")
              if (mode == 5) {
                return if (astroSub == 0) "Moon: zoom in, tap the moon to focus"
                else if (astroSub == 1) "Stars: use a tripod or rest the phone"
                else "Star trails: tripod needed, keep the phone still"
              }
              return ""
            }

            private fun astroZoomPreset() {
              if (mode != 5) return
              if (astroSub == 0) zoomTo(Math.min(zmax, 8f)) else zoomTo(1f)
              info.text = modeInfo()
            }

            // ---------- picture helpers ----------
            private fun decodeLimited(bytes: ByteArray, limit: Int): Bitmap? {
              val o = BitmapFactory.Options()
              o.inJustDecodeBounds = true
              BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
              var ss = 1
              while (Math.max(o.outWidth, o.outHeight) / ss > limit) ss *= 2
              val o2 = BitmapFactory.Options()
              o2.inSampleSize = ss
              return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o2)
            }

            private fun sizeLimit(md: Int): Int {
              val big = Runtime.getRuntime().maxMemory() >= 400L * 1024L * 1024L
              return if (md == 3) 3200 else if (big) 4200 else 3300
            }

            private fun photoParams(z: Float): EnhParams = EnhParams(procLevel, !procOn, sharpLv, beautyLv, colBoost, z > 1.9f, 1f, 1f)

            private fun enhanceInts(px: IntArray, w: Int, h: Int, p: EnhParams, faces: List<Rect>): IntArray {
              val fa = IntArray(faces.size * 4)
              for (i in faces.indices) {
                fa[4 * i] = faces[i].left
                fa[4 * i + 1] = faces[i].top
                fa[4 * i + 2] = faces[i].right
                fa[4 * i + 3] = faces[i].bottom
              }
              return Algo.enhance(px, w, h, p, fa)
            }

            private fun jpegOf(px: IntArray, w: Int, h: Int): ByteArray {
              val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              bm.setPixels(px, 0, w, 0, 0, w, h)
              val bos = ByteArrayOutputStream(1 shl 21)
              bm.compress(Bitmap.CompressFormat.JPEG, 95, bos)
              bm.recycle()
              return bos.toByteArray()
            }

            private fun saveJpeg(out: ByteArray, label: String) {
              val cv = ContentValues()
              cv.put(MediaStore.Images.Media.DISPLAY_NAME, "ProCam_${System.currentTimeMillis()}")
              cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
              cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/ProCam")
              val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)
              if (uri != null) contentResolver.openOutputStream(uri)?.use { it.write(out) }
              runOnUiThread { saved(uri, "image/*", label) }
            }

            // face boxes for an image that only exists as an int array (nearest-neighbour thumbnail, boxes mapped back)
            private fun facesOfInts(px: IntArray, w: Int, h: Int): List<Rect> {
              return try {
                val sc = Math.min(1f, 1000f / Math.max(w, h))
                val sw = Math.max(1, (w * sc).toInt())
                val sh = Math.max(1, (h * sc).toInt())
                val small = IntArray(sw * sh)
                for (y in 0 until sh) {
                  val sy = Math.min(h - 1, (y / sc).toInt())
                  for (x in 0 until sw) small[y * sw + x] = px[sy * w + Math.min(w - 1, (x / sc).toInt())]
                }
                val bm = Bitmap.createBitmap(sw, sh, Bitmap.Config.ARGB_8888)
                bm.setPixels(small, 0, sw, 0, 0, sw, sh)
                val r = detectFaces(bm)
                bm.recycle()
                val res = ArrayList<Rect>()
                for (f in r) res.add(Rect((f.left / sc).toInt(), (f.top / sc).toInt(), (f.right / sc).toInt(), (f.bottom / sc).toInt()))
                res
              } catch (e: Throwable) {
                emptyList<Rect>()
              }
            }

            // median luma of a small decode of a test frame, -1 on failure
            private fun meterLuma(bytes: ByteArray): Int {
              val bmp = decodeLimited(bytes, 640) ?: return -1
              val w = bmp.width
              val h = bmp.height
              val px = IntArray(w * h)
              bmp.getPixels(px, 0, w, 0, 0, w, h)
              bmp.recycle()
              return Astro.skyLevel(px, w, h)
            }

            // ---------- Enhanced Photo + Astronomy: burst capture ----------
            private fun frameMs(p: BurstPlan): Long = if (p.manual) p.expNs / 1_000_000L + 450L else 700L

            private fun ringAt(k: Int): Float {
              val n = Math.max(1, burstPlan?.frames ?: 1)
              val base = if (burstSub >= 2) 0.05f else 0f
              return Math.min(1f, base + (1f - base) * k / n)
            }

            private fun burstStart() {
              if (camera == null || img == null) return
              if (procBusy) {
                toast("Still processing the last photo, please wait")
                return
              }
              gyroSet(true)
              burstSub = if (mode == 4) 0 else 1 + astroSub
              val om = Math.max(omegaFast, omegaSlow)
              burstTripod = omegaSlow >= 0f && omegaSlow <= 0.006f
              burstFocusLock = false
              val plan: BurstPlan
              if (burstSub == 0) {
                plan = Plan.enhanced(aeNs, aeIso, om, hasOis, enhTimeVals[enhTimeIdx], isoLo, isoHi, expLo, expHi, manualCap)
              } else if (!manualCap) {
                toast("This camera does not allow manual exposure here, results may be limited")
                plan = BurstPlan(if (burstSub == 3) 20 else 8, 0L, 0, false, "auto")
              } else if (burstSub == 1) {
                plan = Plan.moon(apertureF, isoLo, expLo, expHi)
              } else {
                plan = Plan.skyTrial(isoLo, isoHi, expLo, expHi)
              }
              burstOn = true
              burstStopReq = false
              burstInFlight = false
              burstMeter = plan.note == "meter"
              burstZ = zCur
              burstDone = 0
              burstErrors = 0
              burstMaxOmega = 0f
              burstPlan = plan
              burstT0 = System.nanoTime()
              procBusy = true
              val q = LinkedBlockingQueue<BFrame>()
              burstQ = q
              val sub = burstSub
              val z = burstZ
              Thread { burstWork(q, sub, z) }.start()
              img?.flashMode = ImageCapture.FLASH_MODE_OFF
              flashView.alpha = 0.5f
              flashView.animate().alpha(0f).setDuration(200).start()
              updateShutter()
              ring.reset()
              if (burstMeter) {
                info.text = "Measuring the sky..."
                ring.sweep(0.05f, 1600L)
              } else {
                info.text = "Hold still  0 / ${plan.frames}"
                ring.sweep(ringAt(1), frameMs(plan))
              }
              burstApply()
            }

            private fun burstOptions(cam: Camera, plan: BurstPlan): CaptureRequestOptions {
              val b = CaptureRequestOptions.Builder()
              b.setCaptureRequestOption(CaptureRequest.CONTROL_MODE, CaptureRequest.CONTROL_MODE_AUTO)
              b.setCaptureRequestOption(CaptureRequest.CONTROL_AWB_LOCK, true)
              if (plan.manual) {
                b.setCaptureRequestOption(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_OFF)
                b.setCaptureRequestOption(CaptureRequest.SENSOR_EXPOSURE_TIME, plan.expNs)
                b.setCaptureRequestOption(CaptureRequest.SENSOR_SENSITIVITY, plan.iso)
                if (plan.expNs > 100_000_000L && maxFrameNs > 0L) {
                  b.setCaptureRequestOption(CaptureRequest.SENSOR_FRAME_DURATION, Math.min(plan.expNs + 5_000_000L, maxFrameNs))
                }
              }
              try {
                val ci = Camera2CameraInfo.from(cam.cameraInfo)
                if (hasOis) {
                  val off = burstSub >= 2 && burstTripod
                  b.setCaptureRequestOption(
                    CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE,
                    if (off) CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_OFF else CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON
                  )
                }
                val nr = ci.getCameraCharacteristic(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES)
                if (nr != null) {
                  if (nr.contains(CaptureRequest.NOISE_REDUCTION_MODE_MINIMAL)) {
                    b.setCaptureRequestOption(CaptureRequest.NOISE_REDUCTION_MODE, CaptureRequest.NOISE_REDUCTION_MODE_MINIMAL)
                  } else if (nr.contains(CaptureRequest.NOISE_REDUCTION_MODE_OFF)) {
                    b.setCaptureRequestOption(CaptureRequest.NOISE_REDUCTION_MODE, CaptureRequest.NOISE_REDUCTION_MODE_OFF)
                  }
                }
                val ed = ci.getCameraCharacteristic(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES)
                if (ed != null && ed.contains(CaptureRequest.EDGE_MODE_OFF)) {
                  b.setCaptureRequestOption(CaptureRequest.EDGE_MODE, CaptureRequest.EDGE_MODE_OFF)
                }
                if (burstSub >= 2 && plan.manual && minFocus > 0f) {
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_OFF)
                  b.setCaptureRequestOption(CaptureRequest.LENS_FOCUS_DISTANCE, 0f)
                } else if (burstFocusLock && minFocus > 0f && focusDist >= 0f) {
                  // focus was settled by the first frame: keep exactly that focus for the rest of the burst
                  b.setCaptureRequestOption(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_OFF)
                  b.setCaptureRequestOption(CaptureRequest.LENS_FOCUS_DISTANCE, focusDist)
                }
              } catch (e: Throwable) {
              }
              return b.build()
            }

            // sets the burst camera options, then takes the next frame
            private fun burstApply() {
              val cam = camera
              val plan = burstPlan
              if (cam == null || plan == null) {
                burstFinish()
                return
              }
              try {
                val c2 = Camera2CameraControl.from(cam.cameraControl)
                val fut = c2.setCaptureRequestOptions(burstOptions(cam, plan))
                fut.addListener({ burstFire() }, ContextCompat.getMainExecutor(this))
              } catch (e: Throwable) {
                burstFire()
              }
            }

            private fun burstFire() {
              if (!burstOn) return
              val ic = img
              if (ic == null || burstStopReq) {
                burstFinish()
                return
              }
              burstInFlight = true
              burstMaxOmega = 0f
              try {
                ic.takePicture(ContextCompat.getMainExecutor(this), burstCb)
              } catch (e: Throwable) {
                burstOnError(e.message ?: "capture failed")
              }
            }

            private val burstCb = object : ImageCapture.OnImageCapturedCallback() {
              override fun onCaptureSuccess(image: ImageProxy) {
                var got: ByteArray? = null
                var rot = 0
                try {
                  val buf = image.planes[0].buffer
                  val bb = ByteArray(buf.remaining())
                  buf.get(bb)
                  got = bb
                  rot = image.imageInfo.rotationDegrees
                } catch (e: Throwable) {
                } finally {
                  image.close()
                }
                val data = got
                if (data == null) burstOnError("read failed") else burstOnFrame(data, rot)
              }

              override fun onError(e: ImageCaptureException) {
                burstOnError(e.message ?: "capture error")
              }
            }

            private fun burstOnFrame(bytes: ByteArray, rot: Int) {
              burstInFlight = false
              val q = burstQ
              val plan = burstPlan
              if (!burstOn || q == null || plan == null) return
              val om = burstMaxOmega
              if (burstMeter) {
                q.put(BFrame(bytes, om, rot, 3))
                return
              }
              q.put(BFrame(bytes, om, rot, 0))
              burstDone++
              val n = plan.frames
              info.text = "Hold still  $burstDone / $n"
              ring.sweep(ringAt(burstDone + 1), frameMs(plan))
              if (burstStopReq || burstDone >= n) {
                burstFinish()
              } else if (burstDone == 1 && burstSub < 2) {
                burstFocusLock = true
                burstApply()
              } else {
                burstFire()
              }
            }

            private fun burstOnError(msg: String) {
              burstInFlight = false
              if (!burstOn) return
              burstErrors++
              if (burstErrors <= 2 && !burstStopReq) {
                handler.postDelayed({ burstFire() }, 250)
              } else {
                toast("Capture problem: $msg")
                burstFinish()
              }
            }

            // the worker measured the sky from the test frame: pick the real exposure and start capturing
            private fun burstAfterMeter(luma: Int) {
              if (!burstOn) return
              val tr = burstPlan
              if (tr == null || luma < 0) {
                toast("Could not measure the sky")
                burstFinish()
                return
              }
              if (burstStopReq) {
                burstFinish()
                return
              }
              val ex = Plan.skyExposure(tr.expNs, tr.iso, luma, burstTripod, 5_000_000_000L, isoLo, isoHi, expLo, expHi, if (burstSub == 3) 40 else 48)
              val n = if (burstSub == 2) Plan.starsFrames(starSecVals[starSecIdx], ex[0], 15)
              else Plan.trailsFrames(trailMinVals[trailMinIdx], ex[0], 240)
              val np = BurstPlan(n, ex[0], ex[1].toInt(), true, "sky")
              burstPlan = np
              burstMeter = false
              burstDone = 0
              burstT0 = System.nanoTime()
              info.text = "Hold still  0 / $n"
              ring.sweep(ringAt(1), frameMs(np))
              if (!burstTripod) toast("The phone is not steady, use a tripod or rest it on something")
              burstApply()
            }

            private fun burstStop() {
              burstStopReq = true
              info.text = "Finishing..."
              if (!burstInFlight) burstFinish()
            }

            private fun burstFinish() {
              if (!burstOn) return
              burstOn = false
              val q = burstQ
              burstQ = null
              try {
                val cam = camera
                if (cam != null) Camera2CameraControl.from(cam.cameraControl).clearCaptureRequestOptions()
              } catch (e: Throwable) {
              }
              applyManual()
              applyFlash()
              ring.reset()
              updateShutter()
              info.text = "Processing..."
              toast("Processing...")
              q?.put(BFrame(ByteArray(0), 0f, 0, 1))
            }

            // ---------- burst worker (own thread): decode, merge / stack, finish, save ----------
            private fun burstWork(q: LinkedBlockingQueue<BFrame>, sub: Int, z: Float) {
              var merger: Merger? = null
              var acc: IntArray? = null
              var w = 0
              var h = 0
              var rot = 0
              var used = 0
              var dropped = 0
              var firstBytes: ByteArray? = null
              var out: ByteArray? = null
              var label = ""
              synchronized(heavy) {
                try {
                  val limit = sizeLimit(0)
                  while (true) {
                    val f = q.take()
                    if (f.kind == 1) break
                    if (f.kind == 3) {
                      val lv = try { meterLuma(f.bytes) } catch (e: Throwable) { -1 }
                      runOnUiThread { burstAfterMeter(lv) }
                      continue
                    }
                    if (sub == 3 && f.omega > 0.03f) {
                      dropped++
                      continue
                    }
                    val bmp = decodeLimited(f.bytes, limit) ?: continue
                    val fw = bmp.width
                    val fh = bmp.height
                    val px = IntArray(fw * fh)
                    bmp.getPixels(px, 0, fw, 0, 0, fw, fh)
                    bmp.recycle()
                    if (used == 0) {
                      w = fw
                      h = fh
                      rot = f.rot
                      if (sub == 3) {
                        Astro.despeckle(px, w, h)
                        acc = px
                      } else {
                        merger = Merger(w, h, px)
                        firstBytes = f.bytes
                      }
                      used = 1
                    } else if (fw == w && fh == h) {
                      if (sub == 3) {
                        Astro.despeckle(px, w, h)
                        val a = acc
                        if (a != null) Astro.maxInto(a, px)
                      } else {
                        val m = merger
                        if (m != null) m.add(px)
                      }
                      used++
                    }
                  }
                  if (used > 0) {
                    var px: IntArray = if (sub == 3) (acc ?: IntArray(0)) else (merger?.finish() ?: IntArray(0))
                    merger = null
                    acc = null
                    val ep: EnhParams
                    if (sub == 1) {
                      Astro.moonStretch(px, w, h)
                      ep = EnhParams(1, false, 3, 0, false, true, 1f, 1f)
                      label = "Moon Photo Saved"
                    } else if (sub == 2) {
                      Astro.despeckle(px, w, h)
                      Astro.skyStretch(px, w, h, 8f, 0.75f, 1.15f)
                      ep = EnhParams(2, false, 1, 0, false, false, 1f, 1f)
                      label = "Stars Photo Saved"
                    } else if (sub == 3) {
                      Astro.skyStretch(px, w, h, 8f, 0.9f, 1.15f)
                      ep = EnhParams(2, false, 1, 0, false, false, 1f, 1f)
                      label = "Star Trails Saved ($used frames)"
                    } else {
                      ep = photoParams(z)
                      label = "Enhanced Photo Saved ($used frames)"
                    }
                    var ww = w
                    var hh = h
                    if (rot % 180 != 0) {
                      ww = h
                      hh = w
                    }
                    if (rot != 0) px = Astro.rotateInts(px, w, h, rot)
                    val faces = if (sub == 0 && procOn && beautyLv > 0) facesOfInts(px, ww, hh) else emptyList<Rect>()
                    val res = enhanceInts(px, ww, hh, ep, faces)
                    px = IntArray(0)
                    out = jpegOf(res, ww, hh)
                  } else {
                    runOnUiThread { toast("No photo was captured") }
                  }
                } catch (e: OutOfMemoryError) {
                  merger = null
                  acc = null
                  out = null
                  System.gc()
                  val fb = firstBytes
                  if (fb != null) {
                    runOnUiThread { toast("Low memory, saving a single frame") }
                    processAndSave(fb, rot, z, 0)
                  } else {
                    runOnUiThread { toast("Not enough memory for this shot") }
                  }
                } catch (e: Throwable) {
                  out = null
                  runOnUiThread { toast("Error: ${e.message}") }
                }
              }
              val done = out
              if (done != null) {
                try {
                  saveJpeg(done, label)
                } catch (e: Throwable) {
                  runOnUiThread { toast("Error: ${e.message}") }
                }
              }
              procBusy = false
              runOnUiThread {
                ring.reset()
                if (!burstOn) info.text = modeInfo()
              }
            }

            private fun c8(v: Float): Int = if (v < 0f) 0 else if (v > 255f) 255 else v.toInt()

            private fun boxF(src: FloatArray, w: Int, h: Int, r: Int): FloatArray {
              val t = FloatArray(src.size)
              val o = FloatArray(src.size)
              val div = (2 * r + 1).toFloat()
              for (y in 0 until h) {
                val b = y * w
                var sum = 0f
                for (i in -r..r) sum += src[b + i.coerceIn(0, w - 1)]
                for (x in 0 until w) {
                  t[b + x] = sum / div
                  sum += src[b + (x + r + 1).coerceAtMost(w - 1)] - src[b + (x - r).coerceAtLeast(0)]
                }
              }
              for (x in 0 until w) {
                var sum = 0f
                for (i in -r..r) sum += t[i.coerceIn(0, h - 1) * w + x]
                for (y in 0 until h) {
                  o[y * w + x] = sum / div
                  sum += t[(y + r + 1).coerceAtMost(h - 1) * w + x] - t[(y - r).coerceAtLeast(0) * w + x]
                }
              }
              return o
            }

            private fun guided(gi: FloatArray, pp: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
              val n = gi.size
              val mI = boxF(gi, w, h, r)
              val mp = boxF(pp, w, h, r)
              val cII = boxF(FloatArray(n) { gi[it] * gi[it] }, w, h, r)
              val cIp = boxF(FloatArray(n) { gi[it] * pp[it] }, w, h, r)
              val aa = FloatArray(n)
              val bb = FloatArray(n)
              for (i in 0 until n) {
                val v = cII[i] - mI[i] * mI[i]
                val c = cIp[i] - mI[i] * mp[i]
                val k = c / (v + eps)
                aa[i] = k
                bb[i] = mp[i] - k * mI[i]
              }
              val ma = boxF(aa, w, h, r)
              val mb = boxF(bb, w, h, r)
              return FloatArray(n) { (ma[it] * gi[it] + mb[it]).coerceIn(0f, 1f) }
            }

            private fun detectFaces(bmp: Bitmap): List<Rect> {
              return try {
                val sc = Math.min(1f, 1000f / Math.max(bmp.width, bmp.height))
                val small = if (sc < 1f) Bitmap.createScaledBitmap(bmp, (bmp.width * sc).toInt(), (bmp.height * sc).toInt(), true) else bmp
                val det = FaceDetection.getClient(
                  FaceDetectorOptions.Builder()
                    .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                    .setMinFaceSize(0.08f)
                    .build()
                )
                val fs = Tasks.await(det.process(InputImage.fromBitmap(small, 0)))
                det.close()
                if (small !== bmp) small.recycle()
                val res = ArrayList<Rect>()
                for (f in fs) {
                  val bb = f.boundingBox
                  res.add(Rect((bb.left / sc).toInt(), (bb.top / sc).toInt(), (bb.right / sc).toInt(), (bb.bottom / sc).toInt()))
                }
                res
              } catch (e: Throwable) {
                emptyList<Rect>()
              }
            }

            private fun portrait(src: Bitmap, faces: List<Rect>): Bitmap? {
              val seg = Segmentation.getClient(SelfieSegmenterOptions.Builder().setDetectorMode(SelfieSegmenterOptions.SINGLE_IMAGE_MODE).build())
              val mask = Tasks.await(seg.process(InputImage.fromBitmap(src, 0)))
              seg.close()
              val mw = mask.width
              val mh = mask.height
              val m = FloatArray(mw * mh)
              mask.buffer.asFloatBuffer().get(m)
              val w = src.width
              val h = src.height
              // 1) work on a reduced copy
              val s1 = Math.min(1f, 1024f / Math.max(w, h))
              val lw = Math.max(16, (w * s1).toInt())
              val lh = Math.max(16, (h * s1).toInt())
              val small = Bitmap.createScaledBitmap(src, lw, lh, true)
              val sp = IntArray(lw * lh)
              small.getPixels(sp, 0, lw, 0, 0, lw, lh)
              if (small !== src) small.recycle()
              val n = lw * lh
              val a = FloatArray(n)
              var cnt = 0
              for (y in 0 until lh) {
                val my = Math.min(mh - 1, y * mh / lh)
                for (x in 0 until lw) {
                  val v = m[my * mw + Math.min(mw - 1, x * mw / lw)]
                  a[y * lw + x] = v
                  if (v > 0.5f) cnt++
                }
              }
              if (cnt < 0.03f * n) return null
              // 2) faces are always part of the subject
              for (f in faces) {
                val cx = (f.left + f.right) / 2f * s1
                val cy = ((f.top + f.bottom) / 2f - f.height() * 0.04f) * s1
                val rx = f.width() * 0.6f * s1
                val ry = f.height() * 0.7f * s1
                if (rx < 2f || ry < 2f) continue
                for (y in Math.max(0, (cy - ry).toInt())..Math.min(lh - 1, (cy + ry).toInt())) {
                  val dy = (y - cy) / ry
                  for (x in Math.max(0, (cx - rx).toInt())..Math.min(lw - 1, (cx + rx).toInt())) {
                    val dx = (x - cx) / rx
                    if (dx * dx + dy * dy < 1f && a[y * lw + x] < 0.95f) a[y * lw + x] = 0.95f
                  }
                }
              }
              // 3) snap the soft mask to real image edges (guided filter)
              val gi = FloatArray(n)
              for (i in 0 until n) {
                val p = sp[i]
                gi[i] = (((p shr 16) and 255) * 77 + ((p shr 8) and 255) * 151 + (p and 255) * 28) / 65280f
              }
              var q = guided(gi, a, lw, lh, Math.max(4, lw / 128), 0.001f)
              q = guided(gi, q, lw, lh, Math.max(2, lw / 256), 0.0005f)
              for (i in 0 until n) {
                val t = ((q[i] - 0.35f) / 0.3f).coerceIn(0f, 1f)
                a[i] = t * t * (3f - 2f * t)
              }
              // 4) distance from subject -> blur radius (farther = blurrier)
              val inf = 1_000_000
              val ds = IntArray(n)
              for (i in 0 until n) ds[i] = if (a[i] > 0.5f) 0 else inf
              for (y in 0 until lh) {
                for (x in 0 until lw) {
                  val i = y * lw + x
                  var v = ds[i]
                  if (x > 0) v = Math.min(v, ds[i - 1] + 3)
                  if (y > 0) {
                    v = Math.min(v, ds[i - lw] + 3)
                    if (x > 0) v = Math.min(v, ds[i - lw - 1] + 4)
                    if (x < lw - 1) v = Math.min(v, ds[i - lw + 1] + 4)
                  }
                  ds[i] = v
                }
              }
              for (y in lh - 1 downTo 0) {
                for (x in lw - 1 downTo 0) {
                  val i = y * lw + x
                  var v = ds[i]
                  if (x < lw - 1) v = Math.min(v, ds[i + 1] + 3)
                  if (y < lh - 1) {
                    v = Math.min(v, ds[i + lw] + 3)
                    if (x < lw - 1) v = Math.min(v, ds[i + lw + 1] + 4)
                    if (x > 0) v = Math.min(v, ds[i + lw - 1] + 4)
                  }
                  ds[i] = v
                }
              }
              val rmax = lw * 0.026f * apMul[apIdx]
              val far = lw * 0.16f
              val rd = FloatArray(n)
              for (i in 0 until n) {
                if (a[i] >= 0.98f) {
                  rd[i] = 0f
                } else {
                  val dn = Math.min(1f, (ds[i] / 3f) / far)
                  rd[i] = rmax * (0.3f + 0.7f * dn * dn * (3f - 2f * dn))
                }
              }
              // 5) disc (bokeh) blur of the background only, bright points weigh more
              val ns = 40
              val vx = FloatArray(ns)
              val vy = FloatArray(ns)
              val vr = FloatArray(ns)
              for (k in 0 until ns) {
                val rr = Math.sqrt((k + 0.5) / ns).toFloat()
                val th = (k * 2.399963).toFloat()
                vx[k] = rr * Math.cos(th.toDouble()).toFloat()
                vy[k] = rr * Math.sin(th.toDouble()).toFloat()
                vr[k] = rr
              }
              val plate = IntArray(n)
              for (y in 0 until lh) {
                for (x in 0 until lw) {
                  val i = y * lw + x
                  val rad = rd[i]
                  if (rad < 0.8f) {
                    plate[i] = sp[i]
                  } else {
                    val ang = (((x * 73856093) xor (y * 19349663)) and 1023) * 0.0061359f
                    val cs = Math.cos(ang.toDouble()).toFloat()
                    val sn = Math.sin(ang.toDouble()).toFloat()
                    var sr = 0f
                    var sg = 0f
                    var sb = 0f
                    var sw = 0f
                    for (k in 0 until ns) {
                      val ox = (vx[k] * cs - vy[k] * sn) * rad
                      val oy = (vx[k] * sn + vy[k] * cs) * rad
                      val sx = (x + ox + 0.5f).toInt().coerceIn(0, lw - 1)
                      val sy = (y + oy + 0.5f).toInt().coerceIn(0, lh - 1)
                      val j = sy * lw + sx
                      if (a[j] > 0.6f) continue
                      val p = sp[j]
                      val pr = (p shr 16) and 255
                      val pg = (p shr 8) and 255
                      val pb = p and 255
                      val l = (pr * 77 + pg * 151 + pb * 28) shr 8
                      var wt = 0.8f + 0.5f * vr[k]
                      if (l > 200) wt *= 1f + 5f * (l - 200) / 55f
                      sr += pr * wt
                      sg += pg * wt
                      sb += pb * wt
                      sw += wt
                    }
                    plate[i] = if (sw > 0f) {
                      (255 shl 24) or (c8(sr / sw) shl 16) or (c8(sg / sw) shl 8) or c8(sb / sw)
                    } else sp[i]
                  }
                }
              }
              // 6) upscale the blurred plate and composite with the sharp original
              val pbm = Bitmap.createBitmap(lw, lh, Bitmap.Config.ARGB_8888)
              pbm.setPixels(plate, 0, lw, 0, 0, lw, lh)
              val big = Bitmap.createScaledBitmap(pbm, w, h, true)
              if (big !== pbm) pbm.recycle()
              val bp = IntArray(w * h)
              big.getPixels(bp, 0, w, 0, 0, w, h)
              big.recycle()
              val px = IntArray(w * h)
              src.getPixels(px, 0, w, 0, 0, w, h)
              for (y in 0 until h) {
                val fy = ((y + 0.5f) * lh / h - 0.5f).coerceIn(0f, lh - 1f)
                val y0 = fy.toInt()
                val y1 = Math.min(lh - 1, y0 + 1)
                val ty = fy - y0
                for (x in 0 until w) {
                  val fx = ((x + 0.5f) * lw / w - 0.5f).coerceIn(0f, lw - 1f)
                  val x0 = fx.toInt()
                  val x1 = Math.min(lw - 1, x0 + 1)
                  val tx = fx - x0
                  val al = (a[y0 * lw + x0] * (1f - tx) + a[y0 * lw + x1] * tx) * (1f - ty) +
                    (a[y1 * lw + x0] * (1f - tx) + a[y1 * lw + x1] * tx) * ty
                  if (al < 0.995f) {
                    val i = y * w + x
                    val p = px[i]
                    val bq = bp[i]
                    val inv = 1f - al
                    val nz = (((x * 1103515245 + y * 12345) ushr 13) and 255) / 128f - 1f
                    val gr = nz * 2.5f * inv
                    val r = c8(((p shr 16) and 255) * al + ((bq shr 16) and 255) * inv + gr)
                    val g = c8(((p shr 8) and 255) * al + ((bq shr 8) and 255) * inv + gr)
                    val b = c8((p and 255) * al + (bq and 255) * inv + gr)
                    px[i] = (255 shl 24) or (r shl 16) or (g shl 8) or b
                  }
                }
              }
              val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              out.setPixels(px, 0, w, 0, 0, w, h)
              return out
            }

            private fun onPause(v: TextView) {
              val r = recording ?: return
              if (paused) { r.resume(); paused = false; v.text = "⏸" } else { r.pause(); paused = true; v.text = "▶"; info.text = "⏸ Paused" }
            }

            private fun startRec() {
              val cap = vc ?: return
              val cv = ContentValues()
              cv.put(MediaStore.Video.Media.DISPLAY_NAME, "ProCam_${System.currentTimeMillis()}")
              cv.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
              cv.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/ProCam")
              val out = MediaStoreOutputOptions.Builder(contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                .setContentValues(cv).build()
              var pr = cap.output.prepareRecording(this, out)
              if (audioOn) {
                if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) pr = pr.withAudioEnabled()
                else toast("Mic permission denied - recording without audio")
              }
              recording = pr.start(ContextCompat.getMainExecutor(this)) { e ->
                if (e is VideoRecordEvent.Status) {
                  val s = e.recordingStats.recordedDurationNanos / 1_000_000_000L
                  info.text = (if (paused) "⏸ " else "● ") + String.format("%02d:%02d", s / 60, s % 60)
                }
                if (e is VideoRecordEvent.Finalize) {
                  recording = null
                  paused = false
                  pauseChip.text = "⏸"
                  reveal(pauseChip, false)
                  updateShutter()
                  info.text = resN[resIdx]
                  if (e.hasError()) toast("Error ${e.error}") else saved(e.outputResults.outputUri, "video/*", "Video Saved")
                  if (pendingFlip) {
                    pendingFlip = false
                    back = !back
                    rebind()
                    handler.postDelayed({ startRec() }, 600)
                  }
                }
              }
              reveal(pauseChip, true)
              updateShutter()
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: procam-${{ github.run_number }}
          name: ProCam build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: app/build/outputs/apk/debug/app-debug.apk
