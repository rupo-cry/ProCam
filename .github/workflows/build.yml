                  pm.getSegment(0f, Math.min(len, remain), seg, true)
                  cv.drawPath(seg, pStroke)
                  remain -= len
                } while (pm.nextContour())
              }
              val fa = ss(0.82f, 1f, t)
              if (fa > 0f) {
                pFill.alpha = (255f * fa).toInt()
                cv.drawPath(sig, pFill)
              }
            }
          }

