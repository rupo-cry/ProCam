                      astroZoomPreset()
                      saveSettings()
                    }
                  }
                  mark(c, i == astroSub)
                  ratioRow.addView(c, lp(-2, -2, 3))
                }
                return
              }
              val names = if (mode == 1) vNames else if (mode == 3) arrayOf("1.5x", "3x") else arrayOf("4:3", "16:9")
              val sel = if (mode == 1) vRatio else if (mode == 3) (if (portraitZoom >= 3f) 1 else 0) else if (ratio169) 1 else 0
              for (i in names.indices) {
                val c = chip(names[i]) {
                  if (mode == 3) {
                    portraitZoom = if (i == 1) 3f else 1.5f
                    zoomTo(portraitZoom)
                    buildRatioRow()
                  } else if (recording == null && !counting && !burstOn) {
                    if (mode == 1) vRatio = i else ratio169 = (i == 1)
                    updateResChip()
                    refreshers.forEach { it() }
                    buildRatioRow()
                    rebind()
                  }
                }
                mark(c, i == sel)
                ratioRow.addView(c, lp(-2, -2, 3))
              }
              if (mode == 4) {
                val tc = chip("\u23F1 " + enhTimeNames[enhTimeIdx]) { v ->
                  if (!burstOn) {
                    enhTimeIdx = (enhTimeIdx + 1) % enhTimeNames.size
                    v.text = "\u23F1 " + enhTimeNames[enhTimeIdx]
                    refreshers.forEach { it() }
                    saveSettings()
                  }
                }
                ratioRow.addView(tc, lp(-2, -2, 3))
              }
            }

            private fun mark(v: TextView, on: Boolean) {
              v.background = if (on) bg(Color.parseColor("#55FF2D4B"), 18, RED) else bg(DARK, 18)
            }

            private fun rowOf(vararg vs: View): LinearLayout {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              for (v in vs) r.addView(v, lp(0, -2, 3, 1f))
              return r
            }

            private fun slider(parent: LinearLayout, name: String, max: Int, cb: (Int, Boolean) -> String): SeekBar {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              r.gravity = Gravity.CENTER_VERTICAL
              val l = TextView(this)
              l.setTextColor(Color.WHITE)
              l.textSize = 12f
              l.text = name
              l.minWidth = dp(70)
              val v = TextView(this)
              v.setTextColor(Color.WHITE)
              v.textSize = 12f
              v.minWidth = dp(70)
              v.gravity = Gravity.END
              val sb = SeekBar(this)
              sb.max = max
              sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { v.text = cb(p, u) }
                override fun onStartTrackingTouch(s: SeekBar?) {}
                override fun onStopTrackingTouch(s: SeekBar?) {}
              })
              r.addView(l)
              r.addView(sb, LinearLayout.LayoutParams(0, -2, 1f))
              r.addView(v)
              parent.addView(r)
              return sb
            }

            private fun setting(parent: LinearLayout, name: String, value: () -> String, click: () -> Unit) {
              val t = chip("") { x -> click(); x.text = "$name      ${value()}"; saveSettings() }
              t.gravity = Gravity.START or Gravity.CENTER_VERTICAL
              t.textSize = 15f
              t.text = "$name      ${value()}"
              refreshers.add { t.text = "$name      ${value()}" }
              parent.addView(t, lp(-1, -2, 4))
            }

