          package com.rupom.procam

          // ===== exposure planning for Enhanced / Astro bursts (pure Kotlin, no Android APIs) =====
          class BurstPlan(
            val frames: Int,
            val expNs: Long,
            val iso: Int,
            val manual: Boolean,
            val note: String
          )

          object Plan {
            private fun clampL(v: Long, lo: Long, hi: Long): Long = if (v < lo) lo else if (v > hi) hi else v
            private fun clampI(v: Int, lo: Int, hi: Int): Int = if (v < lo) lo else if (v > hi) hi else v

            // exposure times that are whole multiples of the mains-light flicker period (100 Hz / 120 Hz):
            // 50 ms steps from 50 ms up, 10 ms steps from 20 ms up, shorter ones unchanged. Only ever rounds down.
            fun flickerSafe(ns: Long): Long {
              val ms = ns / 1_000_000L
              if (ms >= 50L) return (ms / 50L) * 50L * 1_000_000L
              if (ms >= 20L) return (ms / 10L) * 10L * 1_000_000L
              return ns
            }

            // Enhanced Photo. aeNs/aeIso = exposure the camera's own auto exposure uses right now (brightness reference),
            // omega = gyro angular speed in rad/s (negative = unknown), totalSec = wanted capture time (0 = automatic).
            fun enhanced(
              aeNs: Long, aeIso: Int, omega: Float, hasOis: Boolean, totalSec: Float,
              isoLo: Int, isoHi: Int, tLo: Long, tHi: Long, manualOk: Boolean
            ): BurstPlan {
              if (!manualOk || aeNs <= 0L || aeIso <= 0) return BurstPlan(8, 0L, 0, false, "auto")
              val e = aeNs.toDouble() * aeIso.toDouble()
              val om = if (omega < 0f) 0.05 else omega.toDouble()
              val oe = Math.max(0.0015, om * (if (hasOis) 0.4 else 1.0))
              // blur budget about 2-3 px on a 4000 px wide frame -> longest frame time the hand shake allows
              var tf = 0.0009 / oe * 1.0e9
              val cap = if (oe < 0.006) 500_000_000.0 else 250_000_000.0
              tf = Math.max(1.0e9 / 60.0, Math.min(cap, tf))
              // very dim scene: reach the brightness of the auto exposure even if that costs some sharpness
              val tDim = e / isoHi.toDouble()
              if (tf < tDim) tf = Math.min(cap, tDim)
              // bright scene: a longer frame would over-expose even at the lowest ISO
              val tBright = e / isoLo.toDouble()
              var bright = false
              if (tf >= tBright) {
                tf = tBright
                bright = true
              }
              var t = clampL(tf.toLong(), tLo, tHi)
              if (!bright) {
                val fs = flickerSafe(t)
                if (fs >= tLo) t = fs
              }
              val iso = clampI(Math.round(e / t.toDouble()).toInt(), isoLo, isoHi)
              val total = if (totalSec > 0f) totalSec.toDouble() else if (aeIso >= 800) 2.0 else if (aeIso >= 300) 1.5 else 1.0
              var n = Math.round(total * 1.0e9 / t.toDouble()).toInt()
              if (bright) n = Math.min(n, 5)
              n = clampI(n, 3, 12)
              return BurstPlan(n, t, iso, true, if (bright) "bright" else "dim")
            }

            // Moon: the "Looney 11" rule (f/11 at 1/ISO s for a full moon) scaled to the lens aperture, lowest ISO.
            fun moon(aperture: Float, isoLo: Int, tLo: Long, tHi: Long): BurstPlan {
              val ap = if (aperture > 0.5f) aperture.toDouble() else 1.8
              val iso = Math.max(isoLo, 1)
              val sec = ap * ap / 121.0 / iso.toDouble()
              val t = clampL((sec * 1.0e9).toLong(), tLo, tHi)
              return BurstPlan(8, t, iso, true, "moon")
            }

            // first (test) frame of Stars / Trails, only used to measure how bright the sky glow is
            fun skyTrial(isoLo: Int, isoHi: Int, tLo: Long, tHi: Long): BurstPlan {
              val t = clampL(1_000_000_000L, tLo, tHi)
              val iso = clampI(1600, isoLo, isoHi)
              return BurstPlan(1, t, iso, true, "meter")
            }

            // exposure per frame for the sky, from the trial frame: skyLuma = median luma (0..255) of the trial.
            // returns [exposure ns, iso]
            fun skyExposure(
              trialNs: Long, trialIso: Int, skyLuma: Int, tripod: Boolean, tfMaxNs: Long,
              isoLo: Int, isoHi: Int, tLo: Long, tHi: Long, target: Int
            ): LongArray {
              val v = Math.max(2, skyLuma)
              var r = Math.pow(target.toDouble() / v.toDouble(), 2.2)
              r = Math.max(0.05, Math.min(60.0, r))
              val eT = trialNs.toDouble() * trialIso.toDouble() * r
              val capNs = if (tripod) tfMaxNs else Math.min(tfMaxNs, 250_000_000L)
              var t = clampL(capNs, tLo, tHi).toDouble()
              var iso = eT / t
              val isoCap = Math.max(isoLo, Math.min(isoHi, 3200)).toDouble()
              if (iso < isoLo) {
                iso = isoLo.toDouble()
                t = Math.max(tLo.toDouble(), Math.min(t, eT / isoLo))
              }
              if (iso > isoCap) iso = isoCap
              return longArrayOf(clampL(t.toLong(), tLo, tHi), Math.round(iso))
            }

            fun starsFrames(totalSec: Float, tNs: Long, maxFrames: Int): Int =
              clampI(Math.round(totalSec.toDouble() * 1.0e9 / tNs.toDouble()).toInt(), 3, maxFrames)

            // Trails: frames follow each other with a short dead time (about 0.6 s per frame on a phone)
            fun trailsFrames(minutes: Float, tNs: Long, maxFrames: Int): Int {
              val per = tNs.toDouble() / 1.0e9 + 0.6
